<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .board {
      width: 90%;
      max-width: 700px;
      background: white;
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 30px;
    }

    .label {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .code {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 8px;
      padding: 20px;
      background: #f1f3f5;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .qr img {
      width: 220px;
      height: 220px;
    }

    .status {
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="board">

  <h1>Digital Board</h1>

  <div class="label">
    Unique Board Code
  </div>

  <div id="boardCode" class="code">
    Loading...
  </div>

  <div class="qr">
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Fshivamshukla-677.github.io%2FDigital-Board-Management-App%2F"
      alt="Digital Board QR">
  </div>

  <div id="status" class="status">
    Checking board...
  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    query,
    where,
    getDocs,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // ==============================
  // FIREBASE
  // ==============================

  const firebaseConfig = {
    apiKey: "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",
    authDomain: "digital-board-acces-management.firebaseapp.com",
    projectId: "digital-board-acces-management",
    storageBucket: "digital-board-acces-management.firebasestorage.app",
    messagingSenderId: "902348932290",
    appId: "1:902348932290:web:db47f1b012bf882886675b"
  };

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  // ==============================
  // BOARD KEY
  // ==============================

  /*
    IMPORTANT:

    Har physical board ke liye alag BOARD_KEY
    dena hoga.

    Example:

    Board 1:
    BOARD_KEY = "BOARD-001"

    Board 2:
    BOARD_KEY = "BOARD-002"

    Board 3:
    BOARD_KEY = "BOARD-003"
  */

  const BOARD_KEY = "BOARD-001";


  // ==============================
  // RANDOM CODE SETTINGS
  // ==============================

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  const CODE_LENGTH = 6;


  // ==============================
  // RANDOM CODE GENERATOR
  // ==============================

  function generateCode() {

    let code = "";

    for (let i = 0; i < CODE_LENGTH; i++) {

      const randomIndex =
        Math.floor(
          Math.random() * characters.length
        );

      code += characters[randomIndex];
    }

    return code;
  }


  // ==============================
  // CHECK DUPLICATE CODE
  // ==============================

  async function codeExists(code) {

    const q = query(
      collection(db, "boards"),
      where("boardCode", "==", code)
    );

    const snapshot =
      await getDocs(q);

    return !snapshot.empty;
  }


  // ==============================
  // CREATE UNIQUE CODE
  // ==============================

  async function createUniqueCode() {

    while (true) {

      const newCode =
        generateCode();

      const exists =
        await codeExists(newCode);

      if (!exists) {
        return newCode;
      }
    }
  }


  // ==============================
  // LOAD BOARD
  // ==============================

  async function loadBoard() {

    try {

      const boardRef =
        doc(db, "boards", BOARD_KEY);

      const boardSnapshot =
        await getDoc(boardRef);


      // ============================
      // BOARD ALREADY EXISTS
      // ============================

      if (boardSnapshot.exists()) {

        const boardData =
          boardSnapshot.data();

        document.getElementById(
          "boardCode"
        ).textContent =
          boardData.boardCode;

        document.getElementById(
          "status"
        ).textContent =
          "Board ready";

        return;
      }


      // ============================
      // NEW BOARD
      // ============================

      const uniqueCode =
        await createUniqueCode();


      await setDoc(
        boardRef,
        {
          boardKey: BOARD_KEY,
          boardCode: uniqueCode,
          createdAt: serverTimestamp()
        }
      );


      document.getElementById(
        "boardCode"
      ).textContent =
        uniqueCode;

      document.getElementById(
        "status"
      ).textContent =
        "New board created";


    } catch (error) {

      console.error(error);

      document.getElementById(
        "boardCode"
      ).textContent =
        "ERROR";

      document.getElementById(
        "status"
      ).textContent =
        "Unable to load board";

    }

  }


  // ==============================
  // START
  // ==============================

  loadBoard();

</script>

</body>
</html>
