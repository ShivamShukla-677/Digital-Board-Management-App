<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board</title>

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 25px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .board-code {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 5px;
      margin: 20px 0;
      padding: 15px;
      background: #f0f3f7;
      border-radius: 10px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
      background: #fff3cd;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Digital Board</h1>

      <p>Board Code</p>

      <div id="boardCode" class="board-code">
        Loading...
      </div>

      <div id="qrcode"></div>

      <div id="status" class="status">
        Loading board information...
      </div>

    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ==========================
    // FIREBASE CONFIG
    // ==========================

    const firebaseConfig = {
      apiKey: "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",
      authDomain: "digital-board-acces-management.firebaseapp.com",
      projectId: "digital-board-acces-management",
      storageBucket: "digital-board-acces-management.firebasestorage.app",
      messagingSenderId: "902348932290",
      appId: "1:902348932290:web:db47f1b012bf882886675b"
    };

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    // ==========================
    // SETTINGS
    // ==========================

    const CODE_LENGTH = 6;

    const CHARACTERS =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


    // ==========================
    // RANDOM CODE GENERATOR
    // ==========================

    function generateRandomCode() {

      let code = "";

      for (let i = 0; i < CODE_LENGTH; i++) {

        const randomIndex =
          Math.floor(Math.random() * CHARACTERS.length);

        code += CHARACTERS[randomIndex];

      }

      return code;
    }


    // ==========================
    // CHECK CODE ALREADY EXISTS
    // ==========================

    async function codeAlreadyExists(code) {

      const q = query(
        collection(db, "boards"),
        where("boardCode", "==", code)
      );

      const snapshot = await getDocs(q);

      return !snapshot.empty;
    }


    // ==========================
    // CREATE UNIQUE CODE
    // ==========================

    async function createUniqueCode() {

      let code;
      let exists = true;

      while (exists) {

        code = generateRandomCode();

        exists = await codeAlreadyExists(code);

      }

      return code;
    }


    // ==========================
    // GET BOARD NUMBER
    // ==========================

    function getBoardNumber() {

      const params =
        new URLSearchParams(window.location.search);

      return params.get("board");

    }


    // ==========================
    // LOAD BOARD
    // ==========================

    async function loadBoard() {

      try {

        const boardNumber = getBoardNumber();

        if (!boardNumber) {

          document.getElementById("status").innerText =
            "Board information not found.";

          return;
        }


        // Check if this board already exists
        const boardQuery = query(
          collection(db, "boards"),
          where("boardNumber", "==", boardNumber)
        );

        const boardSnapshot =
          await getDocs(boardQuery);


        if (!boardSnapshot.empty) {

          const boardData =
            boardSnapshot.docs[0].data();

          showBoard(
            boardData.boardNumber,
            boardData.boardCode
          );

          return;
        }


        // ==========================
        // CREATE NEW BOARD
        // ==========================

        const uniqueCode =
          await createUniqueCode();


        await addDoc(
          collection(db, "boards"),
          {
            boardNumber: boardNumber,
            boardCode: uniqueCode,
            createdAt: serverTimestamp()
          }
        );


        showBoard(
          boardNumber,
          uniqueCode
        );


      } catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
          "Unable to load board.";

      }

    }


    // ==========================
    // SHOW BOARD
    // ==========================

    function showBoard(boardNumber, boardCode) {

      document.getElementById("boardCode").innerText =
        boardCode;

      document.getElementById("status").innerText =
        "Board ready";


      // QR URL
      const qrURL =
        window.location.origin +
        window.location.pathname +
        "?board=" +
        encodeURIComponent(boardNumber);


      // Generate QR
      document.getElementById("qrcode").innerHTML = "";

      new QRCode(
        document.getElementById("qrcode"),
        {
          text: qrURL,
          width: 220,
          height: 220
        }
      );

    }


    // ==========================
    // START
    // ==========================

    loadBoard();

  </script>

</body>
</html>
