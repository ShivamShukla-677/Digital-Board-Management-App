<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .board {
      background: white;
      width: 90%;
      max-width: 700px;
      padding: 40px;
      text-align: center;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 10px;
    }

    .title {
      font-size: 18px;
      margin-top: 25px;
    }

    .code {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 8px;
      padding: 20px;
      margin: 15px 0;
      background: #f1f3f5;
      border-radius: 12px;
    }

    .qr-box {
      margin-top: 30px;
    }

    .qr-box img {
      width: 220px;
      height: 220px;
    }

    .status {
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="board">

    <h1>Digital Board</h1>

    <div class="title">
      Board Code
    </div>

    <div id="boardCode" class="code">
      Loading...
    </div>

    <div class="qr-box">

      <!-- SAME QR FOR ALL BOARDS -->
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Fshivamshukla-677.github.io%2FDigital-Board-Management-App%2F"
        alt="Digital Board QR Code"
      >

    </div>

    <div id="status" class="status">
      Generating board code...
    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // =========================
    // FIREBASE CONFIG
    // =========================

    const firebaseConfig = {

      apiKey: "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",

      authDomain:
        "digital-board-acces-management.firebaseapp.com",

      projectId:
        "digital-board-acces-management",

      storageBucket:
        "digital-board-acces-management.firebasestorage.app",

      messagingSenderId:
        "902348932290",

      appId:
        "1:902348932290:web:db47f1b012bf882886675b"

    };


    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);


    // =========================
    // CODE SETTINGS
    // =========================

    const characters =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    const codeLength = 6;


    // =========================
    // RANDOM CODE
    // =========================

    function generateRandomCode() {

      let code = "";

      for (let i = 0; i < codeLength; i++) {

        const randomNumber =
          Math.floor(
            Math.random() * characters.length
          );

        code += characters[randomNumber];

      }

      return code;
    }


    // =========================
    // CHECK DUPLICATE
    // =========================

    async function checkCodeExists(code) {

      const q = query(
        collection(db, "boards"),
        where("boardCode", "==", code)
      );

      const result = await getDocs(q);

      return !result.empty;
    }


    // =========================
    // CREATE UNIQUE CODE
    // =========================

    async function createUniqueCode() {

      let code;

      while (true) {

        code = generateRandomCode();

        const exists =
          await checkCodeExists(code);

        if (!exists) {
          return code;
        }

      }

    }


    // =========================
    // CREATE BOARD
    // =========================

    async function createBoard() {

      try {

        const code =
          await createUniqueCode();


        // Save code in Firestore

        await addDoc(
          collection(db, "boards"),
          {
            boardCode: code,
            createdAt: serverTimestamp()
          }
        );


        // Show code

        document.getElementById(
          "boardCode"
        ).textContent = code;


        document.getElementById(
          "status"
        ).textContent =
          "Board is ready";


      } catch (error) {

        console.error(error);

        document.getElementById(
          "boardCode"
        ).textContent = "ERROR";

        document.getElementById(
          "status"
        ).textContent =
          "Unable to create board code.";

      }

    }


    // =========================
    // START
    // =========================

    createBoard();

  </script>

</body>
</html>
