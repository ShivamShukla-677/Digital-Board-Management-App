<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
    }

    .board {
      background: white;
      width: 90%;
      max-width: 600px;
      padding: 40px;
      text-align: center;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 30px;
    }

    .code {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 8px;
      padding: 20px;
      background: #f1f5f9;
      border-radius: 12px;
      margin: 20px 0;
    }

    .status {
      color: #555;
    }
  </style>
</head>

<body>

<div class="board">

  <h1>Digital Board</h1>

  <p>Current Board Code</p>

  <div id="boardCode" class="code">
    Loading...
  </div>

  <div id="status" class="status">
    Generating new code...
  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // ==============================
  // FIREBASE
  // ==============================

  const firebaseConfig = {

    apiKey:
      "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",

    authDomain:
      "digital-board-acces-management.firebaseapp.com",

    projectId:
      "digital-board-acces-management",

    storageBucket:
      "digital-board-acces-management.firebasestorage.app",

    messagingSenderId:
      "902348932290",

    appId:
      "1:902348932290:web:db47f1b012bf882886675b"

  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);


  // ==============================
  // RANDOM CODE
  // ==============================

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  const CODE_LENGTH = 6;


  function generateCode() {

    let code = "";

    for (let i = 0; i < CODE_LENGTH; i++) {

      const randomIndex =
        Math.floor(
          Math.random() * characters.length
        );

      code += characters[randomIndex];

    }

    return code;

  }


  // ==============================
  // CHECK OLD CODE
  // ==============================

  async function codeExists(code) {

    const q = query(
      collection(db, "usedBoardCodes"),
      where("code", "==", code)
    );

    const snapshot =
      await getDocs(q);

    return !snapshot.empty;

  }


  // ==============================
  // CREATE NEW NEVER-USED CODE
  // ==============================

  async function createNewCode() {

    while (true) {

      const code =
        generateCode();

      const exists =
        await codeExists(code);

      if (!exists) {

        // Save permanently as used
        await addDoc(
          collection(db, "usedBoardCodes"),
          {
            code: code,
            createdAt: serverTimestamp()
          }
        );

        return code;

      }

    }

  }


  // ==============================
  // START
  // ==============================

  async function start() {

    try {

      const newCode =
        await createNewCode();

      document.getElementById(
        "boardCode"
      ).textContent = newCode;

      document.getElementById(
        "status"
      ).textContent =
        "New unique code generated";

    } catch (error) {

      console.error(error);

      document.getElementById(
        "boardCode"
      ).textContent =
        "ERROR";

      document.getElementById(
        "status"
      ).textContent =
        "Code generate nahi ho saka";

    }

  }


  start();

</script>

</body>
</html>
