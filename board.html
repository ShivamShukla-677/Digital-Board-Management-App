<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .board {
      width: 90%;
      max-width: 650px;
      background: white;
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .code-label {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .code {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 8px;
      background: #f1f5f9;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px auto;
    }

    #qrcode img {
      width: 220px !important;
      height: 220px !important;
    }

    .qr-text {
      color: #555;
    }

    .status {
      margin-top: 20px;
      color: #555;
    }

    #screenContainer {
      display: none;
      position: fixed;
      inset: 0;
      background: black;
      z-index: 9999;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    #waiting {
      color: white;
      font-size: 24px;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body>

<div class="board" id="mainBoard">

  <h1>Digital Board</h1>

  <div class="subtitle">
    Scan QR Code or use the Board Code
  </div>

  <div class="code-label">
    Current Board Code
  </div>

  <div id="boardCode" class="code">
    ------
  </div>

  <div id="qrcode"></div>

  <div class="qr-text">
    Scan this QR Code to open the Digital Board App
  </div>

  <div id="status" class="status">
    Creating new code...
  </div>

</div>


<!-- LIVE SCREEN -->
<div id="screenContainer">

  <video
    id="remoteVideo"
    autoplay
    playsinline>
  </video>

  <div id="waiting">
    Waiting for Screen Share...
  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =========================================
     FIREBASE
  ========================================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",

    authDomain:
      "digital-board-acces-management.firebaseapp.com",

    projectId:
      "digital-board-acces-management",

    storageBucket:
      "digital-board-acces-management.firebasestorage.app",

    messagingSenderId:
      "902348932290",

    appId:
      "1:902348932290:web:db47f1b012bf882886675b"

  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);


  /* =========================================
     SETTINGS
  ========================================= */

  const CHARACTERS =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  const CODE_LENGTH = 6;

  let currentBoardCode = null;

  let peerConnection = null;

  let candidateUnsubscribe = null;

  let sessionUnsubscribe = null;


  /* =========================================
     RANDOM CODE
  ========================================= */

  function generateRandomCode() {

    let code = "";

    for (let i = 0; i < CODE_LENGTH; i++) {

      const randomIndex =
        Math.floor(
          Math.random() * CHARACTERS.length
        );

      code += CHARACTERS[randomIndex];

    }

    return code;
  }


  /* =========================================
     CHECK OLD CODES
  ========================================= */

  async function codeExists(code) {

    const q =
      query(
        collection(db, "boards"),
        where("boardCode", "==", code)
      );

    const snapshot =
      await getDocs(q);

    if (!snapshot.empty) {
      return true;
    }


    const usedQuery =
      query(
        collection(db, "usedBoardCodes"),
        where("boardCode", "==", code)
      );

    const usedSnapshot =
      await getDocs(usedQuery);

    return !usedSnapshot.empty;
  }


  /* =========================================
     CREATE UNIQUE CODE
  ========================================= */

  async function createUniqueCode() {

    while (true) {

      const code =
        generateRandomCode();

      const exists =
        await codeExists(code);

      if (!exists) {
        return code;
      }

    }
  }


  /* =========================================
     SAVE NEW BOARD CODE
  ========================================= */

  async function createBoardCode() {

    try {

      const newCode =
        await createUniqueCode();


      /*
       If this browser already had
       a previous board code, mark it inactive.
      */

      const oldCode =
        localStorage.getItem(
          "currentBoardCode"
        );


      if (oldCode) {

        const oldBoardRef =
          doc(
            db,
            "boards",
            oldCode
          );

        const oldBoard =
          await getDoc(oldBoardRef);


        if (oldBoard.exists()) {

          await updateDoc(
            oldBoardRef,
            {
              status: "inactive"
            }
          );

        }

      }


      /*
       Save old code permanently
       so it can never be generated again.
      */

      if (oldCode) {

        await setDoc(
          doc(
            db,
            "usedBoardCodes",
            oldCode
          ),
          {
            boardCode: oldCode,
            usedAt: serverTimestamp()
          }
        );

      }


      /*
       Save current code.
      Document ID = Board Code.
      */

      await setDoc(
        doc(
          db,
          "boards",
          newCode
        ),
        {
          boardCode: newCode,
          status: "available",
          createdAt: serverTimestamp()
        }
      );


      currentBoardCode =
        newCode;


      localStorage.setItem(
        "currentBoardCode",
        newCode
      );


      document.getElementById(
        "boardCode"
      ).textContent =
        newCode;


      document.getElementById(
        "status"
      ).textContent =
        "Waiting for Screen Share...";


      startBoardListener(
        newCode
      );

    }

    catch (error) {

      console.error(
        "Board code error:",
        error
      );

      document.getElementById(
        "boardCode"
      ).textContent =
        "ERROR";

      document.getElementById(
        "status"
      ).textContent =
        "Code save nahi ho saka. Firestore rules check karein.";

    }

  }


  /* =========================================
     SAME QR
  ========================================= */

  function createQRCode() {

    const qrContainer =
      document.getElementById(
        "qrcode"
      );

    qrContainer.innerHTML = "";


    new QRCode(
      qrContainer,
      {

        text:
          "https://shivamshukla-677.github.io/Digital-Board-Management-App/",

        width: 220,

        height: 220,

        correctLevel:
          QRCode.CorrectLevel.H

      }
    );

  }


  /* =========================================
     WEBRTC CONFIG
  ========================================= */

  const rtcConfig = {

    iceServers: [

      {
        urls:
          "stun:stun.l.google.com:19302"
      }

    ]

  };


  /* =========================================
     BOARD LISTENER
  ========================================= */

  function startBoardListener(code) {

    if (sessionUnsubscribe) {
      sessionUnsubscribe();
    }


    const sessionRef =
      doc(
        db,
        "sessions",
        code
      );


    sessionUnsubscribe =
      onSnapshot(
        sessionRef,
        async function(snapshot) {

          if (!snapshot.exists()) {
            return;
          }


          const data =
            snapshot.data();


          if (
            data.status === "sharing" &&
            data.offer
          ) {

            await receiveOffer(
              code,
              data.offer
            );

          }


          if (
            data.status === "ended"
          ) {

            stopBoardScreen();

          }

        }
      );

  }


  /* =========================================
     RECEIVE TEACHER OFFER
  ========================================= */

  async function receiveOffer(
    code,
    offerData
  ) {

    try {

      /*
       Close previous connection
      */

      if (peerConnection) {

        peerConnection.close();

      }


      peerConnection =
        new RTCPeerConnection(
          rtcConfig
        );


      const remoteVideo =
        document.getElementById(
          "remoteVideo"
        );


      peerConnection.ontrack =
        function(event) {

          if (
            event.streams &&
            event.streams[0]
          ) {

            remoteVideo.srcObject =
              event.streams[0];

            document.getElementById(
              "screenContainer"
            ).style.display =
              "block";

            document.getElementById(
              "waiting"
            ).style.display =
              "none";

            document.getElementById(
              "mainBoard"
            ).style.display =
              "none";

          }

        };


      /*
       Receive ICE candidates
      */

      const candidateQuery =
        collection(
          db,
          "sessions",
          code,
          "teacherCandidates"
        );


      if (candidateUnsubscribe) {
        candidateUnsubscribe();
      }


      candidateUnsubscribe =
        onSnapshot(
          candidateQuery,
          async function(snapshot) {

            for (
              const change
              of snapshot.docChanges()
            ) {

              if (
                change.type === "added"
              ) {

                try {

                  await peerConnection
                    .addIceCandidate(
                      new RTCIceCandidate(
                        change.doc.data()
                      )
                    );

                }
                catch (e) {

                  console.log(
                    "ICE candidate error",
                    e
                  );

                }

              }

            }

          }
        );


      /*
       Send board ICE candidates
      */

      peerConnection.onicecandidate =
        async function(event) {

          if (!event.candidate) {
            return;
          }


          await addDoc(
            collection(
              db,
              "sessions",
              code,
              "boardCandidates"
            ),
            event.candidate.toJSON()
          );

        };


      /*
       Set teacher offer
      */

      await peerConnection
        .setRemoteDescription(
          new RTCSessionDescription(
            offerData
          )
        );


      /*
       Create answer
      */

      const answer =
        await peerConnection
          .createAnswer();


      await peerConnection
        .setLocalDescription(
          answer
        );


      /*
       Save answer
      */

      await updateDoc(
        doc(
          db,
          "sessions",
          code
        ),
        {
          answer:
            {
              type:
                answer.type,

              sdp:
                answer.sdp
            },

          status:
            "connected"
        }
      );


      document.getElementById(
        "status"
      ).textContent =
        "Screen sharing connected.";

    }

    catch (error) {

      console.error(
        "WebRTC board error:",
        error
      );

    }

  }


  /* =========================================
     STOP BOARD SCREEN
  ========================================= */

  function stopBoardScreen() {

    const video =
      document.getElementById(
        "remoteVideo"
      );


    video.srcObject =
      null;


    document.getElementById(
      "screenContainer"
    ).style.display =
      "none";


    document.getElementById(
      "waiting"
    ).style.display =
      "flex";


    document.getElementById(
      "mainBoard"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).textContent =
      "Waiting for Screen Share...";


    if (peerConnection) {

      peerConnection.close();

      peerConnection =
        null;

    }

  }


  /* =========================================
     START
  ========================================= */

  createQRCode();

  createBoardCode();

</script>

</body>
</html>
