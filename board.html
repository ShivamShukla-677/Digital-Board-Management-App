<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board</title>

  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .board {
      width: 90%;
      max-width: 650px;

      background: white;

      padding: 40px;

      border-radius: 18px;

      text-align: center;

      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .code-label {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .code {
      font-size: 42px;
      font-weight: bold;

      letter-spacing: 8px;

      background: #f1f5f9;

      padding: 20px;

      border-radius: 12px;

      margin-bottom: 30px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;

      margin: 20px auto;
    }

    #qrcode img {
      width: 220px !important;
      height: 220px !important;
    }

    .qr-text {
      margin-top: 15px;
      color: #555;
    }

    .status {
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="board">

    <h1>Digital Board</h1>

    <div class="subtitle">
      Scan QR Code or use the Board Code
    </div>


    <!-- UNIQUE CODE -->

    <div class="code-label">
      Board Code
    </div>

    <div id="boardCode" class="code">
      ------
    </div>


    <!-- SAME QR -->

    <div id="qrcode"></div>

    <div class="qr-text">
      Scan this QR Code to open the Digital Board App
    </div>


    <div id="status" class="status">
      Creating code...
    </div>

  </div>


  <script>

    // ==========================================
    // APP URL
    // ==========================================

    const APP_URL =
      "https://shivamshukla-677.github.io/Digital-Board-Management-App/";


    // ==========================================
    // RANDOM CODE SETTINGS
    // ==========================================

    const characters =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    const CODE_LENGTH = 6;


    // ==========================================
    // GENERATE RANDOM 6 CHARACTER CODE
    // ==========================================

    function generateRandomCode() {

      let code = "";

      for (let i = 0; i < CODE_LENGTH; i++) {

        const randomIndex =
          Math.floor(
            Math.random() * characters.length
          );

        code += characters[randomIndex];

      }

      return code;

    }


    // ==========================================
    // GET OLD USED CODES
    // ==========================================

    function getUsedCodes() {

      try {

        const saved =
          localStorage.getItem(
            "usedBoardCodes"
          );

        if (!saved) {
          return [];
        }

        return JSON.parse(saved);

      } catch (error) {

        return [];

      }

    }


    // ==========================================
    // SAVE USED CODE
    // ==========================================

    function saveUsedCode(code) {

      const codes =
        getUsedCodes();

      codes.push(code);

      localStorage.setItem(
        "usedBoardCodes",
        JSON.stringify(codes)
      );

    }


    // ==========================================
    // CREATE NEW UNIQUE CODE
    // ==========================================

    function createUniqueCode() {

      const usedCodes =
        getUsedCodes();


      let newCode;


      do {

        newCode =
          generateRandomCode();

      } while (
        usedCodes.includes(newCode)
      );


      saveUsedCode(newCode);

      return newCode;

    }


    // ==========================================
    // SHOW CODE
    // ==========================================

    function showCode() {

      const code =
        createUniqueCode();


      document.getElementById(
        "boardCode"
      ).textContent = code;


      document.getElementById(
        "status"
      ).textContent =
        "New unique code generated.";

    }


    // ==========================================
    // CREATE SAME QR CODE
    // ==========================================

    function createQR() {

      const qrContainer =
        document.getElementById(
          "qrcode"
        );


      qrContainer.innerHTML = "";


      new QRCode(
        qrContainer,
        {
          text: APP_URL,

          width: 220,

          height: 220,

          correctLevel:
            QRCode.CorrectLevel.H
        }
      );

    }


    // ==========================================
    // START
    // ==========================================

    createQR();

    showCode();

  </script>

</body>
</html>
