<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board</title>

  <!-- QR CODE LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .board {
      width: 90%;
      max-width: 650px;
      background: white;
      padding: 40px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .code-label {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .code {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 8px;
      background: #f1f5f9;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px auto;
    }

    #qrcode img {
      width: 220px !important;
      height: 220px !important;
    }

    .qr-text {
      color: #555;
    }

    .status {
      margin-top: 20px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="board">

  <h1>Digital Board</h1>

  <div class="subtitle">
    Scan QR Code or use the Board Code
  </div>

  <div class="code-label">
    Current Board Code
  </div>

  <div id="boardCode" class="code">
    ------
  </div>

  <div id="qrcode"></div>

  <div class="qr-text">
    Scan this QR Code to open the Digital Board App
  </div>

  <div id="status" class="status">
    Creating new code...
  </div>

</div>


<script type="module">

  // ==========================================
  // FIREBASE
  // ==========================================

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",

    authDomain:
      "digital-board-acces-management.firebaseapp.com",

    projectId:
      "digital-board-acces-management",

    storageBucket:
      "digital-board-acces-management.firebasestorage.app",

    messagingSenderId:
      "902348932290",

    appId:
      "1:902348932290:web:db47f1b012bf882886675b"

  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);


  // ==========================================
  // SETTINGS
  // ==========================================

  const CHARACTERS =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  const CODE_LENGTH = 6;


  // ==========================================
  // RANDOM CODE
  // ==========================================

  function generateRandomCode() {

    let code = "";

    for (
      let i = 0;
      i < CODE_LENGTH;
      i++
    ) {

      const randomIndex =
        Math.floor(
          Math.random() *
          CHARACTERS.length
        );

      code +=
        CHARACTERS[randomIndex];

    }

    return code;

  }


  // ==========================================
  // CHECK CODE IN FIRESTORE
  // ==========================================

  async function codeExists(code) {

    const q = query(
      collection(db, "boards"),
      where("boardCode", "==", code)
    );

    const snapshot =
      await getDocs(q);

    return !snapshot.empty;

  }


  // ==========================================
  // CREATE UNIQUE CODE
  // ==========================================

  async function createUniqueCode() {

    while (true) {

      const code =
        generateRandomCode();

      const exists =
        await codeExists(code);

      if (!exists) {

        return code;

      }

    }

  }


  // ==========================================
  // SAVE CODE TO FIRESTORE
  // ==========================================

  async function saveBoardCode(code) {

    await addDoc(
      collection(db, "boards"),
      {

        boardCode: code,

        status: "available",

        createdAt:
          serverTimestamp()

      }
    );

  }


  // ==========================================
  // CREATE NEW BOARD CODE
  // ==========================================

  async function createBoardCode() {

    try {

      const newCode =
        await createUniqueCode();


      await saveBoardCode(
        newCode
      );


      document.getElementById(
        "boardCode"
      ).textContent =
        newCode;


      document.getElementById(
        "status"
      ).textContent =
        "New unique code saved successfully.";


    } catch (error) {

      console.error(
        "Board code error:",
        error
      );


      document.getElementById(
        "boardCode"
      ).textContent =
        "ERROR";


      document.getElementById(
        "status"
      ).textContent =
        "Code save nahi ho saka. Firestore rules check karein.";

    }

  }


  // ==========================================
  // SAME QR FOR ALL BOARDS
  // ==========================================

  function createQRCode() {

    const qrContainer =
      document.getElementById(
        "qrcode"
      );


    qrContainer.innerHTML = "";


    new QRCode(
      qrContainer,
      {

        text:
          "https://shivamshukla-677.github.io/Digital-Board-Management-App/",

        width: 220,

        height: 220,

        correctLevel:
          QRCode.CorrectLevel.H

      }
    );

  }


  // ==========================================
  // START
  // ==========================================

  createQRCode();

  createBoardCode();

</script>

</body>
</html>
