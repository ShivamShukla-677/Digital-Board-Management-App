<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board Management</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
      margin-bottom: 25px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      color: #777;
    }

    .tab.active {
      color: #2563eb;
      border-bottom: 3px solid #2563eb;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .login-link {
      display: none;
      text-align: center;
      margin-top: 15px;
    }

    .login-link a {
      color: #2563eb;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Digital Board Management</h1>

  <!-- TABS -->
  <div class="tabs">

    <div
      class="tab active"
      id="loginTab">
      Login
    </div>

    <div
      class="tab"
      id="registerTab">
      Register
    </div>

  </div>


  <!-- =========================
       LOGIN FORM
  ========================== -->

  <div
    class="form active"
    id="loginForm">

    <label>Gmail</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter your Gmail"
      autocomplete="email"
    >

    <button id="loginBtn">
      Send Verification Link
    </button>

    <div
      id="loginMessage"
      class="message">
    </div>

  </div>


  <!-- =========================
       REGISTER FORM
  ========================== -->

  <div
    class="form"
    id="registerForm">

    <label>Name</label>

    <input
      type="text"
      id="name"
      placeholder="Enter your name"
    >


    <label>Gmail</label>

    <input
      type="email"
      id="email"
      placeholder="example@gmail.com"
      autocomplete="email"
    >


    <label>Mobile Number</label>

    <input
      type="tel"
      id="mobile"
      placeholder="10 digit mobile number"
      maxlength="10"
    >


    <button id="registerBtn">
      Register & Verify Gmail
    </button>


    <div
      id="registerMessage"
      class="message">
    </div>


    <div
      class="login-link"
      id="alreadyLogin">

      Already registered?
      <a id="goLogin">Login here</a>

    </div>

  </div>

</div>


<script type="module">

  /* =====================================================
     FIREBASE IMPORTS
  ===================================================== */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getAuth,
    sendSignInLinkToEmail,
    isSignInWithEmailLink,
    signInWithEmailLink,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =====================================================
     FIREBASE CONFIG
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",

    authDomain:
      "digital-board-acces-management.firebaseapp.com",

    projectId:
      "digital-board-acces-management",

    storageBucket:
      "digital-board-acces-management.firebasestorage.app",

    messagingSenderId:
      "902348932290",

    appId:
      "1:902348932290:web:db47f1b012bf882886675b"

  };


  /* =====================================================
     INITIALIZE FIREBASE
  ===================================================== */

  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  /* =====================================================
     IMPORTANT COORDINATOR EMAIL
     
     EXACT EMAIL:
     
     anujshivamshukla99359@gmail.com
  ===================================================== */

  const COORDINATOR_EMAIL =
    "anujshivamshukla99359@gmail.com";


  /* =====================================================
     EMAIL LINK SETTINGS
  ===================================================== */

  const actionCodeSettings = {

    url:
      window.location.origin +
      window.location.pathname,

    handleCodeInApp:
      true

  };


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");

  const loginForm =
    document.getElementById("loginForm");

  const registerForm =
    document.getElementById("registerForm");

  const loginBtn =
    document.getElementById("loginBtn");

  const registerBtn =
    document.getElementById("registerBtn");

  const goLogin =
    document.getElementById("goLogin");


  /* =====================================================
     TAB: LOGIN
  ===================================================== */

  loginTab.addEventListener(
    "click",
    () => {

      loginTab.classList.add("active");

      registerTab.classList.remove("active");

      loginForm.classList.add("active");

      registerForm.classList.remove("active");

    }
  );


  /* =====================================================
     TAB: REGISTER
  ===================================================== */

  registerTab.addEventListener(
    "click",
    () => {

      registerTab.classList.add("active");

      loginTab.classList.remove("active");

      registerForm.classList.add("active");

      loginForm.classList.remove("active");

    }
  );


  /* =====================================================
     GO TO LOGIN
  ===================================================== */

  goLogin.addEventListener(
    "click",
    () => {

      loginTab.click();

    }
  );


  /* =====================================================
     MESSAGE FUNCTION
  ===================================================== */

  function showMessage(
    id,
    text,
    type
  ) {

    const box =
      document.getElementById(id);

    box.textContent =
      text;

    box.className =
      "message " + type;

  }


  /* =====================================================
     LOGIN BUTTON
     
     VERY IMPORTANT:
     
     COORDINATOR CHECK IS FIRST.
     
     FIRESTORE IS NOT TOUCHED FOR COORDINATOR.
  ===================================================== */

  loginBtn.addEventListener(
    "click",
    async () => {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim()
          .toLowerCase();


      /* EMPTY EMAIL */

      if (!email) {

        showMessage(
          "loginMessage",
          "Please enter your Gmail.",
          "error"
        );

        return;
      }


      /* =================================================
         COORDINATOR LOGIN
         
         THIS MUST HAPPEN BEFORE FIRESTORE.
      ================================================= */

      if (
        email ===
        COORDINATOR_EMAIL
      ) {

        console.log(
          "COORDINATOR LOGIN DETECTED"
        );


        try {

          /* Save coordinator email */

          localStorage.setItem(
            "emailForSignIn",
            COORDINATOR_EMAIL
          );


          localStorage.setItem(
            "loginType",
            "coordinator"
          );


          /* SEND VERIFICATION LINK */

          await sendSignInLinkToEmail(
            auth,
            COORDINATOR_EMAIL,
            actionCodeSettings
          );


          showMessage(
            "loginMessage",
            "Coordinator verification link sent. Please check your Gmail.",
            "success"
          );


        } catch (error) {

          console.error(
            "COORDINATOR ERROR:",
            error
          );


          showMessage(
            "loginMessage",
            "Unable to send verification link: " +
            error.message,
            "error"
          );

        }


        /*
          STOP HERE.
          
          FIRESTORE CHECK WILL NEVER RUN
          FOR COORDINATOR.
        */

        return;
      }


      /* =================================================
         NORMAL USER LOGIN
         
         FIRESTORE CHECK ONLY FOR NORMAL USERS.
      ================================================= */

      try {

        const usersRef =
          collection(
            db,
            "registrationRequests"
          );


        const q =
          query(
            usersRef,
            where(
              "email",
              "==",
              email
            )
          );


        const snapshot =
          await getDocs(q);


        /* USER NOT FOUND */

        if (
          snapshot.empty
        ) {

          showMessage(
            "loginMessage",
            "You are not registered. Please register first.",
            "error"
          );

          return;
        }


        let userData =
          null;


        snapshot.forEach(
          (doc) => {

            userData =
              doc.data();

          }
        );


        /* NOT APPROVED */

        if (
          userData.status !==
          "approved"
        ) {

          if (
            userData.status ===
            "pending"
          ) {

            showMessage(
              "loginMessage",
              "Your registration is still pending approval.",
              "info"
            );

          } else if (
            userData.status ===
            "rejected"
          ) {

            showMessage(
              "loginMessage",
              "Your registration has been rejected.",
              "error"
            );

          } else {

            showMessage(
              "loginMessage",
              "Your registration is not approved yet.",
              "error"
            );

          }

          return;
        }


        /* APPROVED USER */

        localStorage.setItem(
          "emailForSignIn",
          email
        );


        localStorage.setItem(
          "loginType",
          "user"
        );


        await sendSignInLinkToEmail(
          auth,
          email,
          actionCodeSettings
        );


        showMessage(
          "loginMessage",
          "Login verification link sent. Please check your Gmail.",
          "success"
        );


      } catch (error) {

        console.error(error);


        showMessage(
          "loginMessage",
          "Error: " +
          error.message,
          "error"
        );

      }

    }
  );


  /* =====================================================
     REGISTER BUTTON
  ===================================================== */

  registerBtn.addEventListener(
    "click",
    async () => {

      const name =
        document
          .getElementById("name")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const mobile =
        document
          .getElementById("mobile")
          .value
          .trim();


      /* NAME */

      if (!name) {

        showMessage(
          "registerMessage",
          "Please enter your name.",
          "error"
        );

        return;
      }


      /* GMAIL */

      if (
        !email.endsWith(
          "@gmail.com"
        )
      ) {

        showMessage(
          "registerMessage",
          "Please use a valid @gmail.com address.",
          "error"
        );

        return;
      }


      /* MOBILE */

      if (
        !/^[0-9]{10}$/.test(
          mobile
        )
      ) {

        showMessage(
          "registerMessage",
          "Mobile number must be exactly 10 digits.",
          "error"
        );

        return;
      }


      try {

        const usersRef =
          collection(
            db,
            "registrationRequests"
          );


        /* CHECK DUPLICATE EMAIL */

        const emailQuery =
          query(
            usersRef,
            where(
              "email",
              "==",
              email
            )
          );


        const emailSnapshot =
          await getDocs(
            emailQuery
          );


        if (
          !emailSnapshot.empty
        ) {

          showMessage(
            "registerMessage",
            "Already exists. Please login.",
            "error"
          );


          document
            .getElementById(
              "alreadyLogin"
            )
            .style.display =
              "block";


          return;
        }


        /* CHECK DUPLICATE MOBILE */

        const mobileQuery =
          query(
            usersRef,
            where(
              "mobile",
              "==",
              mobile
            )
          );


        const mobileSnapshot =
          await getDocs(
            mobileQuery
          );


        if (
          !mobileSnapshot.empty
        ) {

          showMessage(
            "registerMessage",
            "Already exists. Please login.",
            "error"
          );


          document
            .getElementById(
              "alreadyLogin"
            )
            .style.display =
              "block";


          return;
        }


        /* SAVE TEMPORARY DATA */

        localStorage.setItem(
          "pendingName",
          name
        );


        localStorage.setItem(
          "pendingMobile",
          mobile
        );


        localStorage.setItem(
          "emailForSignIn",
          email
        );


        localStorage.setItem(
          "loginType",
          "registration"
        );


        /* SEND VERIFICATION LINK */

        await sendSignInLinkToEmail(
          auth,
          email,
          actionCodeSettings
        );


        showMessage(
          "registerMessage",
          "Verification link sent to your Gmail. Please open the link.",
          "success"
        );


      } catch (error) {

        console.error(error);


        showMessage(
          "registerMessage",
          "Error: " +
          error.message,
          "error"
        );

      }

    }
  );


  /* =====================================================
     PROCESS EMAIL LINK
  ===================================================== */

  async function processEmailLink() {

    /* Not an email link */

    if (
      !isSignInWithEmailLink(
        auth,
        window.location.href
      )
    ) {

      return;
    }


    /* Get email from localStorage */

    let email =
      localStorage.getItem(
        "emailForSignIn"
      );


    /* If missing, ask email */

    if (!email) {

      email =
        window.prompt(
          "Please enter the email address where you received the verification link:"
        );

    }


    if (!email) {

      showMessage(
        "loginMessage",
        "Email is required to complete verification.",
        "error"
      );

      return;
    }


    email =
      email
        .trim()
        .toLowerCase();


    try {

      /* COMPLETE EMAIL LINK LOGIN */

      const result =
        await signInWithEmailLink(
          auth,
          email,
          window.location.href
        );


      const verifiedEmail =
        result.user.email
          .trim()
          .toLowerCase();


      console.log(
        "VERIFIED EMAIL:",
        verifiedEmail
      );


      /* =================================================
         COORDINATOR
         
         DIRECT DASHBOARD.
         
         NO FIRESTORE.
         NO REGISTRATION CHECK.
      ================================================= */

      if (
        verifiedEmail ===
        COORDINATOR_EMAIL
      ) {

        console.log(
          "COORDINATOR VERIFIED"
        );


        localStorage.removeItem(
          "emailForSignIn"
        );


        localStorage.removeItem(
          "loginType"
        );


        localStorage.removeItem(
          "pendingName"
        );


        localStorage.removeItem(
          "pendingMobile"
        );


        /* DIRECT DASHBOARD */

        window.location.replace(
          "coordinator.html"
        );


        return;
      }


      /* =================================================
         NORMAL REGISTRATION
      ================================================= */

      const loginType =
        localStorage.getItem(
          "loginType"
        );


      const pendingName =
        localStorage.getItem(
          "pendingName"
        );


      const pendingMobile =
        localStorage.getItem(
          "pendingMobile"
        );


      if (
        loginType ===
          "registration" &&
        pendingName &&
        pendingMobile
      ) {

        await addDoc(
          collection(
            db,
            "registrationRequests"
          ),
          {

            uid:
              result.user.uid,

            name:
              pendingName,

            email:
              verifiedEmail,

            mobile:
              pendingMobile,

            verifiedBy:
              "gmail",

            status:
              "pending",

            createdAt:
              serverTimestamp()

          }
        );


        localStorage.removeItem(
          "pendingName"
        );


        localStorage.removeItem(
          "pendingMobile"
        );


        localStorage.removeItem(
          "emailForSignIn"
        );


        localStorage.removeItem(
          "loginType"
        );


        showMessage(
          "registerMessage",
          "Gmail verified successfully. Your registration is now pending Coordinator approval.",
          "success"
        );


        return;
      }


      /* =================================================
         NORMAL APPROVED USER
      ================================================= */

      if (
        loginType ===
        "user"
      ) {

        localStorage.removeItem(
          "emailForSignIn"
        );


        localStorage.removeItem(
          "loginType"
        );


        showMessage(
          "loginMessage",
          "Gmail verified successfully.",
          "success"
        );


        return;
      }


    } catch (error) {

      console.error(
        "EMAIL LINK ERROR:",
        error
      );


      showMessage(
        "loginMessage",
        "Verification failed: " +
        error.message,
        "error"
      );

    }

  }


  /* =====================================================
     START EMAIL LINK PROCESSING
  ===================================================== */

  processEmailLink();


  /* =====================================================
     AUTH STATE
  ===================================================== */

  onAuthStateChanged(
    auth,
    (user) => {

      if (user) {

        console.log(
          "Firebase logged in:",
          user.email
        );

      }

    }
  );

</script>

</body>
</html>
