<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Board Management System</title>

<style>
*{
  box-sizing:border-box;
  font-family:Inter,Arial,sans-serif;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top left,#dbeafe 0%,transparent 35%),
    radial-gradient(circle at bottom right,#e0e7ff 0%,transparent 35%),
    #f5f7fb;
  color:#172033;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}

.container{
  width:100%;
  max-width:760px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:26px;
  padding:40px;
  box-shadow:0 25px 70px rgba(15,23,42,.12);
}

.brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.brand-icon{
  width:46px;
  height:46px;
  border-radius:13px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:800;
}

.brand-title h1{
  margin:0;
  font-size:21px;
}

.brand-title span{
  display:block;
  color:#64748b;
  font-size:12px;
  margin-top:3px;
}

.tabs{
  display:flex;
  gap:8px;
  background:#f1f5f9;
  padding:6px;
  border-radius:14px;
  margin-bottom:25px;
}

.tab{
  flex:1;
  border:none;
  background:transparent;
  padding:12px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  color:#64748b;
}

.tab.active{
  background:white;
  color:#1d4ed8;
  box-shadow:0 3px 10px rgba(15,23,42,.08);
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
  color:#334155;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #dbe4f0;
  border-radius:12px;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

.primary{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.secondary{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:1px solid #dbe4f0;
  border-radius:12px;
  background:white;
  color:#334155;
  font-weight:700;
  cursor:pointer;
}

.message{
  display:none;
  margin-top:16px;
  padding:13px;
  border-radius:12px;
  font-size:13px;
}

.message.show{
  display:block;
}

.info{
  background:#eff6ff;
  color:#1d4ed8;
}

.success{
  background:#ecfdf5;
  color:#047857;
}

.error{
  background:#fef2f2;
  color:#b91c1c;
}

#boardAccess{
  display:none;
}

.board-card{
  text-align:center;
}

.board-card h2{
  margin-top:0;
}

.board-card p{
  color:#64748b;
  font-size:13px;
}

.board-code-input{
  text-align:center;
  font-size:25px;
  font-weight:800;
  letter-spacing:5px;
  text-transform:uppercase;
}

.live-box{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:14px;
  background:#ecfdf5;
  color:#047857;
  font-weight:700;
}

.footer{
  text-align:center;
  margin-top:25px;
  color:#94a3b8;
  font-size:11px;
}

@media(max-width:600px){
  body{
    padding:15px;
  }

  .container{
    padding:25px 18px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="brand">

    <div class="brand-icon">
      DB
    </div>

    <div class="brand-title">
      <h1>Digital Board</h1>
      <span>College Management System</span>
    </div>

  </div>


  <!-- LOGIN / REGISTER -->

  <div id="authSection">

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showTab('login')">
        Login
      </button>

      <button
        class="tab"
        id="registerTab"
        onclick="showTab('register')">
        Register
      </button>

    </div>


    <!-- LOGIN -->

    <div
      class="form active"
      id="loginForm">

      <label>Gmail</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="Enter Gmail">


      <label>Password</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Enter Digital Board password">


      <button
        class="primary"
        onclick="loginUser()">

        Login

      </button>

    </div>


    <!-- REGISTER -->

    <div
      class="form"
      id="registerForm">

      <label>Full Name</label>

      <input
        type="text"
        id="registerName"
        placeholder="Enter full name">


      <label>Gmail</label>

      <input
        type="email"
        id="registerEmail"
        placeholder="example@gmail.com">


      <label>Mobile Number</label>

      <input
        type="tel"
        id="registerMobile"
        maxlength="10"
        placeholder="10 digit mobile number">


      <label>Digital Board Password</label>

      <input
        type="password"
        id="registerPassword"
        placeholder="Create your password">


      <button
        class="primary"
        onclick="registerUser()">

        Register

      </button>

    </div>


    <div
      id="message"
      class="message">
    </div>

  </div>


  <!-- BOARD ACCESS -->

  <div id="boardAccess">

    <div class="board-card">

      <h2>Digital Board Access</h2>

      <p>
        Enter the 6-character Board Code shown on the Digital Board.
      </p>


      <input
        class="board-code-input"
        id="boardCodeInput"
        maxlength="6"
        placeholder="ABC123">


      <button
        class="primary"
        onclick="verifyBoardCode()">

        Verify Board

      </button>


      <button
        class="secondary"
        id="shareButton"
        onclick="startScreenShare()"
        style="display:none;">

        Start Screen Share

      </button>


      <button
        class="secondary"
        id="stopButton"
        onclick="stopScreenShare()"
        style="display:none;">

        Stop Sharing

      </button>


      <div
        class="live-box"
        id="liveBox">

        ✓ Screen Sharing is Live

      </div>


      <div
        id="boardMessage"
        class="message">
      </div>

    </div>

  </div>


  <div class="footer">
    Digital Board Management System • College Project
  </div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  addDoc,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  onSnapshot,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
    "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZ",

  authDomain:
    "digital-board-acces-management.firebaseapp.com",

  projectId:
    "digital-board-acces-management",

  storageBucket:
    "digital-board-acces-management.firebasestorage.app",

  messagingSenderId:
    "902348932290",

  appId:
    "1:902348932290:web:db47f1b012bf882886675b"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* CONSTANTS */

const COORDINATOR_EMAIL =
  "anujshivamshukla99359@gmail.com";

const COORDINATOR_PASSWORD =
  "password123456";


let currentBoardCode = null;

let peerConnection = null;

let localStream = null;

let answerListener = null;

let boardCandidateListener = null;

let approvalListener = null;

let screenShareStarted = false;


/* TABS */

window.showTab = function(tab){

  document
    .getElementById("loginTab")
    .classList
    .toggle("active",tab === "login");

  document
    .getElementById("registerTab")
    .classList
    .toggle("active",tab === "register");

  document
    .getElementById("loginForm")
    .classList
    .toggle("active",tab === "login");

  document
    .getElementById("registerForm")
    .classList
    .toggle("active",tab === "register");

};


function showMessage(
  text,
  type="info"
){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message show " + type;

}


function showBoardMessage(
  text,
  type="info"
){

  const box =
    document.getElementById("boardMessage");

  box.textContent = text;

  box.className =
    "message show " + type;

}


function showBoardAccess(){

  document
    .getElementById("authSection")
    .style.display = "none";

  document
    .getElementById("boardAccess")
    .style.display = "block";

}


/* REGISTER */

window.registerUser = async function(){

  const name =
    document
      .getElementById("registerName")
      .value
      .trim();

  const email =
    document
      .getElementById("registerEmail")
      .value
      .trim()
      .toLowerCase();

  const mobile =
    document
      .getElementById("registerMobile")
      .value
      .trim();

  const password =
    document
      .getElementById("registerPassword")
      .value;


  if(
    !name ||
    !email ||
    !mobile ||
    !password
  ){

    showMessage(
      "Please fill all fields.",
      "error"
    );

    return;
  }


  if(
    !email.endsWith("@gmail.com")
  ){

    showMessage(
      "Please use a valid Gmail address.",
      "error"
    );

    return;
  }


  if(
    !/^\d{10}$/.test(mobile)
  ){

    showMessage(
      "Mobile number must be exactly 10 digits.",
      "error"
    );

    return;
  }


  if(password.length < 6){

    showMessage(
      "Password must contain at least 6 characters.",
      "error"
    );

    return;
  }


  try{

    const emailQuery =
      query(
        collection(
          db,
          "registrationRequests"
        ),
        where(
          "email",
          "==",
          email
        )
      );


    const emailSnapshot =
      await getDocs(emailQuery);


    const mobileQuery =
      query(
        collection(
          db,
          "registrationRequests"
        ),
        where(
          "mobile",
          "==",
          mobile
        )
      );


    const mobileSnapshot =
      await getDocs(mobileQuery);


    if(
      !emailSnapshot.empty ||
      !mobileSnapshot.empty
    ){

      showMessage(
        "Already exists. Please login.",
        "error"
      );

      return;
    }


    const credential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    await addDoc(

      collection(
        db,
        "registrationRequests"
      ),

      {

        uid:
          credential.user.uid,

        name:
          name,

        email:
          email,

        mobile:
          mobile,

        status:
          "pending",

        createdAt:
          serverTimestamp()

      }

    );


    await signOut(auth);


    showMessage(
      "Registration successful. Waiting for Coordinator approval.",
      "success"
    );


    startApprovalListener(email);

  }

  catch(error){

    console.error(error);

    if(
      error.code ===
      "auth/email-already-in-use"
    ){

      showMessage(
        "Already exists. Please login.",
        "error"
      );

    }

    else{

      showMessage(
        error.message,
        "error"
      );

    }

  }

};


/* APPROVAL LISTENER */

function startApprovalListener(email){

  if(approvalListener){

    approvalListener();

    approvalListener = null;

  }


  const q =
    query(
      collection(
        db,
        "registrationRequests"
      ),
      where(
        "email",
        "==",
        email
      )
    );


  approvalListener =
    onSnapshot(
      q,
      snapshot => {

        snapshot.forEach(
          docSnap => {

            const data =
              docSnap.data();


            if(
              data.status ===
              "approved"
            ){

              showBoardAccess();

              showBoardMessage(
                "✓ Registration approved. Enter Board Code.",
                "success"
              );

            }


            if(
              data.status ===
              "rejected"
            ){

              showMessage(
                "Your registration was rejected by Coordinator.",
                "error"
              );

            }

          }
        );

      }
    );

}


/* LOGIN */

window.loginUser = async function(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim()
      .toLowerCase();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!email || !password){

    showMessage(
      "Please enter Gmail and password.",
      "error"
    );

    return;
  }


  if(
    !email.endsWith("@gmail.com")
  ){

    showMessage(
      "Please use a valid Gmail address.",
      "error"
    );

    return;
  }


  try{

    /* COORDINATOR */

    if(
      email === COORDINATOR_EMAIL
    ){

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      window.location.href =
        "coordinator.html";

      return;

    }


    /* NORMAL USER */

    const q =
      query(
        collection(
          db,
          "registrationRequests"
        ),
        where(
          "email",
          "==",
          email
        )
      );


    const snapshot =
      await getDocs(q);


    if(snapshot.empty){

      showMessage(
        "Account not registered.",
        "error"
      );

      return;
    }


    let record = null;


    snapshot.forEach(
      docSnap => {

        record =
          docSnap.data();

      }
    );


    if(
      record.status ===
      "pending"
    ){

      showMessage(
        "Your registration is still pending Coordinator approval.",
        "info"
      );

      startApprovalListener(email);

      return;
    }


    if(
      record.status ===
      "rejected"
    ){

      showMessage(
        "Your registration was rejected.",
        "error"
      );

      return;
    }


    if(
      record.status !==
      "approved"
    ){

      showMessage(
        "Account status is not approved.",
        "error"
      );

      return;
    }


    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    showBoardAccess();


    showBoardMessage(
      "✓ Login successful. Enter Board Code.",
      "success"
    );

  }

  catch(error){

    console.error(error);

    showMessage(
      "Incorrect Gmail or password.",
      "error"
    );

  }

};


/* BOARD CODE */

window.verifyBoardCode = async function(){

  const code =
    document
      .getElementById("boardCodeInput")
      .value
      .trim()
      .toUpperCase();


  if(
    !/^[A-Z0-9]{6}$/.test(code)
  ){

    showBoardMessage(
      "Board Code must contain exactly 6 characters.",
      "error"
    );

    return;
  }


  try{

    const boardRef =
      doc(
        db,
        "boards",
        code
      );


    const boardSnapshot =
      await getDoc(boardRef);


    if(!boardSnapshot.exists()){

      showBoardMessage(
        "Invalid Board Code.",
        "error"
      );

      return;
    }


    const data =
      boardSnapshot.data();


    if(
      data.status !==
      "available"
    ){

      showBoardMessage(
        "This Board Code is not active.",
        "error"
      );

      return;
    }


    currentBoardCode =
      code;


    document
      .getElementById("shareButton")
      .style.display =
      "block";


    showBoardMessage(
      "✓ Board verified. You can start Screen Share.",
      "success"
    );

  }

  catch(error){

    console.error(error);

    showBoardMessage(
      "Unable to verify Board Code.",
      "error"
    );

  }

};


/* WEBRTC */

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    }

  ]

};


/* START SCREEN SHARE */

window.startScreenShare = async function(){

  if(!currentBoardCode){

    showBoardMessage(
      "Please verify Board Code first.",
      "error"
    );

    return;
  }


  if(screenShareStarted){

    return;
  }


  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getDisplayMedia
    ){

      showBoardMessage(
        "Screen sharing is not supported on this page/browser.",
        "error"
      );

      return;
    }


    /*
      IMPORTANT:
      Browser will show the screen picker.
      Select "Entire Screen".
    */

    localStream =
      await navigator.mediaDevices.getDisplayMedia({

        video:true,

        audio:false

      });


    screenShareStarted =
      true;


    document
      .getElementById("shareButton")
      .style.display =
      "none";


    document
      .getElementById("stopButton")
      .style.display =
      "block";


    document
      .getElementById("liveBox")
      .style.display =
      "block";


    showBoardMessage(
      "✓ Screen sharing started successfully.",
      "success"
    );


    peerConnection =
      new RTCPeerConnection(
        rtcConfig
      );


    /*
      ADD SCREEN TRACK
    */

    localStream
      .getTracks()
      .forEach(
        track => {

          peerConnection.addTrack(
            track,
            localStream
          );

        }
      );


    /*
      IF USER PRESSES
      STOP SHARING IN BROWSER
    */

    const videoTrack =
      localStream
        .getVideoTracks()[0];


    if(videoTrack){

      videoTrack.onended =
        () => {

          stopScreenShare();

        };

    }


    /*
      TEACHER ICE
    */

    peerConnection.onicecandidate =
      async event => {

        if(
          !event.candidate
        ){

          return;

        }


        try{

          await addDoc(

            collection(
              db,
              "sessions",
              currentBoardCode,
              "teacherCandidates"
            ),

            event.candidate.toJSON()

          );

        }

        catch(error){

          console.error(
            error
          );

        }

      };


    /*
      CREATE OFFER
    */

    const offer =
      await peerConnection
        .createOffer();


    await peerConnection
      .setLocalDescription(
        offer
      );


    /*
      SAVE OFFER
    */

    await setDoc(

      doc(
        db,
        "sessions",
        currentBoardCode
      ),

      {

        offer:{

          type:
            offer.type,

          sdp:
            offer.sdp

        },

        status:
          "active",

        startedAt:
          serverTimestamp()

      }

    );


    /*
      LISTEN FOR BOARD ANSWER
    */

    const sessionRef =
      doc(
        db,
        "sessions",
        currentBoardCode
      );


    answerListener =
      onSnapshot(

        sessionRef,

        async snapshot => {

          if(
            !snapshot.exists()
          ){

            return;

          }


          const data =
            snapshot.data();


          if(
            data.answer &&
            peerConnection &&
            !peerConnection.currentRemoteDescription
          ){

            try{

              await peerConnection
                .setRemoteDescription(

                  new RTCSessionDescription(
                    data.answer
                  )

                );

            }

            catch(error){

              console.error(
                "Answer error:",
                error
              );

            }

          }

        }

      );


    /*
      RECEIVE BOARD ICE
    */

    const boardCandidates =
      collection(
        db,
        "sessions",
        currentBoardCode,
        "boardCandidates"
      );


    boardCandidateListener =
      onSnapshot(

        boardCandidates,

        async snapshot => {

          for(
            const change
            of snapshot.docChanges()
          ){

            if(
              change.type !==
              "added"
            ){

              continue;

            }


            if(!peerConnection){

              continue;

            }


            try{

              await peerConnection
                .addIceCandidate(

                  new RTCIceCandidate(
                    change.doc.data()
                  )

                );

            }

            catch(error){

              console.log(
                "Board ICE error:",
                error
              );

            }

          }

        }

      );

  }

  catch(error){

    console.error(
      "Screen Share Error:",
      error
    );


    screenShareStarted =
      false;


    if(
      error.name ===
      "NotAllowedError"
    ){

      showBoardMessage(
        "Screen sharing was cancelled.",
        "error"
      );

    }

    else{

      showBoardMessage(
        "Unable to start Screen Share: " +
        error.message,
        "error"
      );

    }

  }

};


/* STOP SCREEN SHARE */

window.stopScreenShare =
async function(){

  try{

    if(localStream){

      localStream
        .getTracks()
        .forEach(
          track => {

            track.stop();

          }
        );

      localStream =
        null;

    }


    if(peerConnection){

      peerConnection.close();

      peerConnection =
        null;

    }


    if(answerListener){

      answerListener();

      answerListener =
        null;

    }


    if(boardCandidateListener){

      boardCandidateListener();

      boardCandidateListener =
        null;

    }


    if(currentBoardCode){

      try{

        await updateDoc(

          doc(
            db,
            "sessions",
            currentBoardCode
          ),

          {

            status:
              "ended",

            endedAt:
              serverTimestamp()

          }

        );

      }

      catch(error){

        console.log(error);

      }

    }


    screenShareStarted =
      false;


    document
      .getElementById("stopButton")
      .style.display =
      "none";


    document
      .getElementById("shareButton")
      .style.display =
      "block";


    document
      .getElementById("liveBox")
      .style.display =
      "none";


    showBoardMessage(
      "Screen sharing stopped.",
      "info"
    );

  }

  catch(error){

    console.error(error);

  }

};


onAuthStateChanged(
  auth,
  user => {

    if(user){

      console.log(
        "Logged in:",
        user.email
      );

    }

  }
);

</script>

</body>
</html>
