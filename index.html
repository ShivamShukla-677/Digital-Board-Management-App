<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board Management</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 420px;
      max-width: 92%;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      background: #e5e7eb;
      cursor: pointer;
      font-size: 15px;
    }

    .tab.active {
      background: #2563eb;
      color: white;
    }

    .tab:first-child {
      border-radius: 7px 0 0 7px;
    }

    .tab:last-child {
      border-radius: 0 7px 7px 0;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }

    .verify-title {
      margin-top: 18px;
      font-weight: bold;
    }

    .verify-options {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .verify-option {
      flex: 1;
      padding: 12px;
      border: 2px solid #cbd5e1;
      border-radius: 7px;
      background: white;
      cursor: pointer;
      text-align: center;
      font-size: 14px;
    }

    .verify-option.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }

    button.submit {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.submit:hover {
      background: #1d4ed8;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #16a34a;
    }

    .login-link {
      margin-top: 10px;
      text-align: center;
      display: none;
    }

    .login-link button {
      border: none;
      background: none;
      color: #2563eb;
      cursor: pointer;
      font-weight: bold;
    }

    #otpSection {
      display: none;
    }

    #recaptcha-container {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Digital Board Management</h1>

  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab active"
      id="loginTab"
      onclick="showLogin()">
      Login
    </button>

    <button
      class="tab"
      id="registerTab"
      onclick="showRegister()">
      Register
    </button>

  </div>


  <!-- LOGIN -->

  <div class="form active" id="loginForm">

    <label>Gmail</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="example@gmail.com">

    <button
      class="submit"
      onclick="loginUser()">
      Login
    </button>

    <div
      id="loginMessage"
      class="message">
    </div>

  </div>


  <!-- REGISTER -->

  <div class="form" id="registerForm">

    <label>Full Name</label>

    <input
      type="text"
      id="name"
      placeholder="Enter your full name">


    <label>Gmail</label>

    <input
      type="email"
      id="email"
      placeholder="example@gmail.com">


    <label>Mobile Number</label>

    <input
      type="tel"
      id="mobile"
      maxlength="10"
      inputmode="numeric"
      placeholder="10 digit mobile number">


    <div class="verify-title">
      Verify using
    </div>


    <div class="verify-options">

      <button
        type="button"
        class="verify-option selected"
        id="emailVerify"
        onclick="selectVerification('email')">
        📧 Gmail
      </button>

      <button
        type="button"
        class="verify-option"
        id="phoneVerify"
        onclick="selectVerification('phone')">
        📱 Mobile
      </button>

    </div>


    <button
      class="submit"
      onclick="startVerification()">
      Start Verification
    </button>


    <!-- RECAPTCHA -->

    <div id="recaptcha-container"></div>


    <!-- OTP -->

    <div id="otpSection">

      <label>Enter SMS OTP</label>

      <input
        type="text"
        id="otp"
        maxlength="6"
        inputmode="numeric"
        placeholder="Enter 6 digit OTP">

      <button
        class="submit"
        onclick="verifyPhoneOTP()">
        Verify OTP
      </button>

    </div>


    <div
      id="registerMessage"
      class="message">
    </div>


    <div
      id="loginLink"
      class="login-link">

      Already registered?

      <button onclick="showLogin()">
        Please Login
      </button>

    </div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp,
    getDocs
  }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

  import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber,
    sendSignInLinkToEmail,
    isSignInWithEmailLink,
    signInWithEmailLink
  }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  /* FIREBASE CONFIG */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",

    authDomain:
      "digital-board-acces-management.firebaseapp.com",

    projectId:
      "digital-board-acces-management",

    storageBucket:
      "digital-board-acces-management.firebasestorage.app",

    messagingSenderId:
      "902348932290",

    appId:
      "1:902348932290:web:db47f1b012bf882886675b"

  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const auth = getAuth(app);


  let verificationMethod = "email";

  let confirmationResult = null;

  let recaptchaVerifier = null;


  /* -------------------------
     LOGIN TAB
  ------------------------- */

  window.showLogin = function() {

    document
      .getElementById("loginForm")
      .classList.add("active");

    document
      .getElementById("registerForm")
      .classList.remove("active");

    document
      .getElementById("loginTab")
      .classList.add("active");

    document
      .getElementById("registerTab")
      .classList.remove("active");

  };


  /* -------------------------
     REGISTER TAB
  ------------------------- */

  window.showRegister = function() {

    document
      .getElementById("registerForm")
      .classList.add("active");

    document
      .getElementById("loginForm")
      .classList.remove("active");

    document
      .getElementById("registerTab")
      .classList.add("active");

    document
      .getElementById("loginTab")
      .classList.remove("active");

  };


  /* -------------------------
     SELECT VERIFICATION
  ------------------------- */

  window.selectVerification = function(method) {

    verificationMethod = method;

    document
      .getElementById("emailVerify")
      .classList.remove("selected");

    document
      .getElementById("phoneVerify")
      .classList.remove("selected");


    if (method === "email") {

      document
        .getElementById("emailVerify")
        .classList.add("selected");

    } else {

      document
        .getElementById("phoneVerify")
        .classList.add("selected");

    }


    document
      .getElementById("otpSection")
      .style.display = "none";

    document
      .getElementById("registerMessage")
      .innerText = "";

  };


  /* -------------------------
     DUPLICATE CHECK
  ------------------------- */

  async function checkAlreadyExists(email, mobile) {

    const snapshot =
      await getDocs(
        collection(db, "registrationRequests")
      );


    let emailExists = false;

    let mobileExists = false;


    snapshot.forEach((doc) => {

      const data = doc.data();


      if (
        data.email &&
        data.email.toLowerCase() ===
        email.toLowerCase()
      ) {

        emailExists = true;

      }


      if (
        data.mobile &&
        data.mobile === mobile
      ) {

        mobileExists = true;

      }

    });


    return {
      emailExists,
      mobileExists
    };

  }


  /* -------------------------
     START VERIFICATION
  ------------------------- */

  window.startVerification = async function() {

    const name =
      document.getElementById("name")
        .value.trim();

    const email =
      document.getElementById("email")
        .value.trim();

    const mobile =
      document.getElementById("mobile")
        .value.trim();

    const message =
      document.getElementById("registerMessage");

    const loginLink =
      document.getElementById("loginLink");


    message.className = "message";

    message.innerText = "";

    loginLink.style.display = "none";


    /* NAME */

    if (name === "") {

      message.classList.add("error");

      message.innerText =
        "⚠️ Please enter your name.";

      return;

    }


    /* GMAIL */

    if (
      !/^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(email)
    ) {

      message.classList.add("error");

      message.innerText =
        "⚠️ Please enter a valid Gmail ending with @gmail.com.";

      return;

    }


    /* MOBILE */

    if (!/^[0-9]{10}$/.test(mobile)) {

      message.classList.add("error");

      message.innerText =
        "⚠️ Mobile number must contain exactly 10 digits.";

      return;

    }


    try {

      /* DUPLICATE CHECK */

      const exists =
        await checkAlreadyExists(
          email,
          mobile
        );


      if (
        exists.emailExists ||
        exists.mobileExists
      ) {

        message.className =
          "message error";


        if (
          exists.emailExists &&
          exists.mobileExists
        ) {

          message.innerText =
            "⚠️ Gmail and mobile number already exist. Please login.";

        }

        else if (exists.emailExists) {

          message.innerText =
            "⚠️ Gmail already exists. Please login.";

        }

        else {

          message.innerText =
            "⚠️ Mobile number already exists. Please login.";

        }


        loginLink.style.display =
          "block";

        return;

      }


      /* -------------------------
         EMAIL VERIFICATION
      ------------------------- */

      if (verificationMethod === "email") {

        const actionCodeSettings = {

          url:
            window.location.origin +
            window.location.pathname,

          handleCodeInApp: true

        };


        await sendSignInLinkToEmail(
          auth,
          email,
          actionCodeSettings
        );


        localStorage.setItem(
          "emailForSignIn",
          email
        );


        localStorage.setItem(
          "pendingName",
          name
        );

        localStorage.setItem(
          "pendingMobile",
          mobile
        );


        message.className =
          "message success";


        message.innerText =
          "📧 Verification link has been sent to your Gmail. Open the email and click the link.";

      }


      /* -------------------------
         PHONE VERIFICATION
      ------------------------- */

      else {

        if (!recaptchaVerifier) {

          recaptchaVerifier =
            new RecaptchaVerifier(
              auth,
              "recaptcha-container",
              {
                size: "normal"
              }
            );

        }


        const phoneNumber =
          "+91" + mobile;


        confirmationResult =
          await signInWithPhoneNumber(
            auth,
            phoneNumber,
            recaptchaVerifier
          );


        document
          .getElementById("otpSection")
          .style.display = "block";


        message.className =
          "message success";


        message.innerText =
          "📱 OTP sent to your mobile number.";

      }

    }

    catch (error) {

      console.error(error);

      message.className =
        "message error";


      if (
        error.code ===
        "auth/invalid-phone-number"
      ) {

        message.innerText =
          "⚠️ Invalid mobile number.";

      }

      else if (
        error.code ===
        "auth/too-many-requests"
      ) {

        message.innerText =
          "⚠️ Too many attempts. Please try again later.";

      }

      else {

        message.innerText =
          "⚠️ Verification could not be started: " +
          error.message;

      }

    }

  };


  /* -------------------------
     PHONE OTP VERIFY
  ------------------------- */

  window.verifyPhoneOTP = async function() {

    const otp =
      document.getElementById("otp")
        .value.trim();

    const message =
      document.getElementById("registerMessage");


    if (!/^[0-9]{6}$/.test(otp)) {

      message.className =
        "message error";

      message.innerText =
        "⚠️ Please enter the 6 digit OTP.";

      return;

    }


    if (!confirmationResult) {

      message.className =
        "message error";

      message.innerText =
        "⚠️ Please request OTP first.";

      return;

    }


    try {

      const result =
        await confirmationResult.confirm(otp);


      const user =
        result.user;


      await submitRegistration(
        user.uid,
        "phone"
      );


    }

    catch (error) {

      console.error(error);

      message.className =
        "message error";

      message.innerText =
        "⚠️ Invalid OTP. Please try again.";

    }

  };


  /* -------------------------
     EMAIL LINK VERIFY
  ------------------------- */

  async function checkEmailLink() {

    if (
      !isSignInWithEmailLink(
        auth,
        window.location.href
      )
    ) {

      return;

    }


    let email =
      localStorage.getItem(
        "emailForSignIn"
      );


    if (!email) {

      email =
        window.prompt(
          "Please enter your Gmail again:"
        );

    }


    if (!email) {

      return;

    }


    try {

      const result =
        await signInWithEmailLink(
          auth,
          email,
          window.location.href
        );


      const user =
        result.user;


      await submitRegistration(
        user.uid,
        "email"
      );


      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );

    }

    catch (error) {

      console.error(error);

      document
        .getElementById("registerMessage")
        .className = "message error";

      document
        .getElementById("registerMessage")
        .innerText =
        "⚠️ Email verification failed.";

    }

  }


  /* -------------------------
     SUBMIT REGISTRATION
  ------------------------- */

  async function submitRegistration(
    uid,
    verifiedBy
  ) {

    const name =
      localStorage.getItem(
        "pendingName"
      );

    const email =
      localStorage.getItem(
        "emailForSignIn"
      );

    const mobile =
      localStorage.getItem(
        "pendingMobile"
      );


    const message =
      document.getElementById(
        "registerMessage"
      );


    try {

      await addDoc(
        collection(
          db,
          "registrationRequests"
        ),
        {

          uid: uid,

          name: name,

          email: email,

          mobile: mobile,

          verifiedBy: verifiedBy,

          status: "pending",

          createdAt:
            serverTimestamp()

        }
      );


      localStorage.removeItem(
        "emailForSignIn"
      );

      localStorage.removeItem(
        "pendingName"
      );

      localStorage.removeItem(
        "pendingMobile"
      );


      message.className =
        "message success";


      message.innerText =
        "✅ Verification successful! Your registration request has been sent to the Coordinator for approval.";

    }

    catch (error) {

      console.error(error);

      message.className =
        "message error";

      message.innerText =
        "⚠️ Registration could not be submitted.";

    }

  }


  /* -------------------------
     LOGIN
  ------------------------- */

  window.loginUser = function() {

    const email =
      document.getElementById(
        "loginEmail"
      ).value.trim();

    const message =
      document.getElementById(
        "loginMessage"
      );


    if (
      !/^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(email)
    ) {

      message.className =
        "message error";

      message.innerText =
        "⚠️ Please enter a valid Gmail.";

      return;

    }


    message.className =
      "message success";

    message.innerText =
      "Login verification will be connected after Coordinator approval.";

  };


  /* CHECK EMAIL VERIFICATION LINK */

  checkEmailLink();

</script>

</body>
</html>
