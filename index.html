<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Board Management</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 450px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
    }

    .tabs button {
      width: 50%;
      padding: 12px;
      border: none;
      background: #ddd;
      cursor: pointer;
      font-size: 16px;
    }

    .tabs button.active {
      background: #2563eb;
      color: white;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .main-btn {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .main-btn:hover {
      background: #1d4ed8;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 7px;
      display: none;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Digital Board Management</h1>

  <div class="tabs">
    <button id="registerTab"
            class="active"
            onclick="showRegister()">
      Register
    </button>

    <button id="loginTab"
            onclick="showLogin()">
      Login
    </button>
  </div>


  <!-- REGISTER -->

  <div id="registerForm" class="form active">

    <label>Name</label>

    <input
      type="text"
      id="name"
      placeholder="Enter your name"
    >


    <label>Gmail</label>

    <input
      type="email"
      id="email"
      placeholder="example@gmail.com"
    >


    <label>Mobile Number</label>

    <input
      type="tel"
      id="mobile"
      maxlength="10"
      placeholder="10 digit mobile number"
    >


    <button class="main-btn"
            onclick="registerUser()">
      Register
    </button>

    <div id="registerMessage"
         class="message">
    </div>

  </div>


  <!-- LOGIN -->

  <div id="loginForm" class="form">

    <label>Gmail</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter your Gmail"
    >


    <button class="main-btn"
            onclick="loginUser()">
      Send Login Link
    </button>

    <div id="loginMessage"
         class="message">
    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  sendSignInLinkToEmail,
  isSignInWithEmailLink,
  signInWithEmailLink
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",

  authDomain:
    "digital-board-acces-management.firebaseapp.com",

  projectId:
    "digital-board-acces-management",

  storageBucket:
    "digital-board-acces-management.firebasestorage.app",

  messagingSenderId:
    "902348932290",

  appId:
    "1:902348932290:web:db47f1b012bf882886675b"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);



/* COORDINATOR EMAIL */

const COORDINATOR_EMAIL =
  "anujshivamshukla99359@gamil.com";



/* EMAIL LINK SETTINGS */

const actionCodeSettings = {

  url:
    "https://shivamshukla-677.github.io/Digital-Board-Management-App/",

  handleCodeInApp: true

};



/* TAB FUNCTIONS */

window.showRegister = function () {

  document
    .getElementById("registerForm")
    .classList.add("active");

  document
    .getElementById("loginForm")
    .classList.remove("active");

  document
    .getElementById("registerTab")
    .classList.add("active");

  document
    .getElementById("loginTab")
    .classList.remove("active");

};


window.showLogin = function () {

  document
    .getElementById("loginForm")
    .classList.add("active");

  document
    .getElementById("registerForm")
    .classList.remove("active");

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("registerTab")
    .classList.remove("active");

};



/* MESSAGE */

function showMessage(
  id,
  text,
  type
) {

  const box =
    document.getElementById(id);

  box.textContent = text;

  box.className =
    "message " + type;

}



/* REGISTER */

window.registerUser = async function () {

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const email =
    document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();


  const mobile =
    document
      .getElementById("mobile")
      .value
      .trim();



  /* COORDINATOR CANNOT REGISTER */

  if (email === COORDINATOR_EMAIL) {

    showMessage(
      "registerMessage",
      "This Gmail is the Coordinator account. Please use Login.",
      "info"
    );

    return;
  }



  /* NAME */

  if (!name) {

    showMessage(
      "registerMessage",
      "Please enter your name.",
      "error"
    );

    return;
  }



  /* GMAIL */

  if (!email.endsWith("@gmail.com")) {

    showMessage(
      "registerMessage",
      "Please enter a valid @gmail.com address.",
      "error"
    );

    return;
  }



  /* MOBILE */

  if (!/^[0-9]{10}$/.test(mobile)) {

    showMessage(
      "registerMessage",
      "Mobile number must be exactly 10 digits.",
      "error"
    );

    return;
  }



  try {

    /* EMAIL CHECK */

    const emailQuery =
      query(
        collection(
          db,
          "registrationRequests"
        ),
        where(
          "email",
          "==",
          email
        )
      );


    const emailSnapshot =
      await getDocs(emailQuery);



    /* MOBILE CHECK */

    const mobileQuery =
      query(
        collection(
          db,
          "registrationRequests"
        ),
        where(
          "mobile",
          "==",
          mobile
        )
      );


    const mobileSnapshot =
      await getDocs(mobileQuery);



    if (
      !emailSnapshot.empty ||
      !mobileSnapshot.empty
    ) {

      showMessage(
        "registerMessage",
        "Already exists. Please login.",
        "error"
      );

      return;
    }



    /* SAVE TEMP DATA */

    localStorage.setItem(
      "pendingName",
      name
    );

    localStorage.setItem(
      "pendingMobile",
      mobile
    );

    localStorage.setItem(
      "emailForSignIn",
      email
    );



    /* SEND VERIFICATION */

    await sendSignInLinkToEmail(
      auth,
      email,
      actionCodeSettings
    );


    showMessage(
      "registerMessage",
      "Verification link sent to your Gmail. Please check your inbox.",
      "success"
    );


  } catch (error) {

    console.error(error);

    showMessage(
      "registerMessage",
      error.message,
      "error"
    );

  }

};



/* LOGIN */

window.loginUser = async function () {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim()
      .toLowerCase();



  if (!email) {

    showMessage(
      "loginMessage",
      "Please enter your Gmail.",
      "error"
    );

    return;
  }



  /*
     IMPORTANT:
     COORDINATOR CHECK COMES FIRST.
     FIRESTORE STATUS WILL NOT MATTER.
  */

  if (email === COORDINATOR_EMAIL) {

    try {

      localStorage.setItem(
        "loginEmail",
        email
      );

      localStorage.setItem(
        "loginType",
        "coordinator"
      );


      await sendSignInLinkToEmail(
        auth,
        email,
        actionCodeSettings
      );


      showMessage(
        "loginMessage",
        "Coordinator login link sent to your Gmail.",
        "success"
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "loginMessage",
        error.message,
        "error"
      );

    }

    return;
  }



  /* NORMAL USER */

  if (!email.endsWith("@gmail.com")) {

    showMessage(
      "loginMessage",
      "Please enter a valid @gmail.com address.",
      "error"
    );

    return;
  }



  try {

    const q =
      query(
        collection(
          db,
          "registrationRequests"
        ),
        where(
          "email",
          "==",
          email
        )
      );


    const snapshot =
      await getDocs(q);



    if (snapshot.empty) {

      showMessage(
        "loginMessage",
        "You are not registered. Please register first.",
        "error"
      );

      return;
    }



    let approved = false;


    snapshot.forEach(doc => {

      if (
        doc.data().status === "approved"
      ) {

        approved = true;

      }

    });



    if (!approved) {

      showMessage(
        "loginMessage",
        "Your registration is still pending Coordinator approval.",
        "error"
      );

      return;
    }



    localStorage.setItem(
      "loginEmail",
      email
    );

    localStorage.setItem(
      "loginType",
      "user"
    );


    await sendSignInLinkToEmail(
      auth,
      email,
      actionCodeSettings
    );


    showMessage(
      "loginMessage",
      "Login link sent to your Gmail.",
      "success"
    );


  } catch (error) {

    console.error(error);

    showMessage(
      "loginMessage",
      error.message,
      "error"
    );

  }

};



/* PROCESS EMAIL LINK */

async function processEmailLink() {

  if (
    !isSignInWithEmailLink(
      auth,
      window.location.href
    )
  ) {

    return;

  }



  let email =
    localStorage.getItem(
      "emailForSignIn"
    ) ||
    localStorage.getItem(
      "loginEmail"
    );



  if (!email) {

    email =
      window.prompt(
        "Please enter your email address"
      );

  }



  if (!email) {
    return;
  }



  try {

    const result =
      await signInWithEmailLink(
        auth,
        email,
        window.location.href
      );


    const verifiedEmail =
      result.user.email
        .toLowerCase();



    /*
       COORDINATOR CHECK
       AGAIN AFTER VERIFICATION
    */

    if (
      verifiedEmail ===
      COORDINATOR_EMAIL
    ) {

      localStorage.removeItem(
        "loginEmail"
      );

      localStorage.removeItem(
        "loginType"
      );

      localStorage.removeItem(
        "pendingName"
      );

      localStorage.removeItem(
        "pendingMobile"
      );

      localStorage.removeItem(
        "emailForSignIn"
      );


      window.location.href =
        "coordinator.html";

      return;
    }



    /* REGISTRATION */

    const pendingName =
      localStorage.getItem(
        "pendingName"
      );


    const pendingMobile =
      localStorage.getItem(
        "pendingMobile"
      );



    if (
      pendingName &&
      pendingMobile
    ) {

      await addDoc(
        collection(
          db,
          "registrationRequests"
        ),
        {

          uid:
            result.user.uid,

          name:
            pendingName,

          email:
            verifiedEmail,

          mobile:
            pendingMobile,

          verifiedBy:
            "gmail",

          status:
            "pending",

          createdAt:
            serverTimestamp()

        }
      );



      localStorage.removeItem(
        "pendingName"
      );

      localStorage.removeItem(
        "pendingMobile"
      );

      localStorage.removeItem(
        "emailForSignIn"
      );



      showMessage(
        "registerMessage",
        "Gmail verified successfully. Your registration request has been sent to the Coordinator.",
        "success"
      );


      showRegister();

      return;

    }



    /* NORMAL USER */

    showMessage(
      "loginMessage",
      "Gmail verified successfully.",
      "success"
    );


  } catch (error) {

    console.error(error);

    showMessage(
      "loginMessage",
      "Verification failed: " +
      error.message,
      "error"
    );

  }

}


processEmailLink();

</script>

</body>
</html>
