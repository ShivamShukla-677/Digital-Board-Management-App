<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Board | College Management System</title>

<style>

*{
  box-sizing:border-box;
  font-family:Inter,Arial,sans-serif;
}

html,body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top left,#dbeafe 0%,transparent 35%),
    radial-gradient(circle at bottom right,#e0e7ff 0%,transparent 35%),
    #f5f7fb;
  color:#172033;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
}

.container{
  width:100%;
  max-width:760px;
  background:rgba(255,255,255,.97);
  border:1px solid #e5e7eb;
  border-radius:26px;
  padding:40px;
  box-shadow:0 25px 70px rgba(15,23,42,.12);
}

.brand{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.brand-icon{
  width:46px;
  height:46px;
  border-radius:13px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:800;
}

.brand-title{
  text-align:left;
}

.brand-title h1{
  margin:0;
  font-size:21px;
}

.brand-title span{
  display:block;
  color:#64748b;
  font-size:12px;
  margin-top:3px;
}

.tabs{
  display:flex;
  gap:8px;
  background:#f1f5f9;
  padding:6px;
  border-radius:14px;
  margin-bottom:25px;
}

.tab{
  flex:1;
  border:none;
  background:transparent;
  padding:12px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  color:#64748b;
}

.tab.active{
  background:white;
  color:#1d4ed8;
  box-shadow:0 3px 10px rgba(15,23,42,.08);
}

.form{
  display:none;
}

.form.active{
  display:block;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
  color:#334155;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #dbe4f0;
  border-radius:12px;
  outline:none;
  font-size:14px;
  background:#fff;
}

input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

button.primary{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

button.secondary{
  width:100%;
  margin-top:12px;
  padding:13px;
  border:1px solid #dbe4f0;
  border-radius:12px;
  background:white;
  color:#334155;
  font-weight:700;
  cursor:pointer;
}

.message{
  margin-top:16px;
  padding:12px 14px;
  border-radius:12px;
  font-size:13px;
  display:none;
}

.message.show{
  display:block;
}

.message.info{
  background:#eff6ff;
  color:#1d4ed8;
  border:1px solid #bfdbfe;
}

.message.success{
  background:#ecfdf5;
  color:#047857;
  border:1px solid #a7f3d0;
}

.message.error{
  background:#fef2f2;
  color:#b91c1c;
  border:1px solid #fecaca;
}

#boardAccess{
  display:none;
}

.board-card{
  text-align:center;
}

.board-card h2{
  margin-top:0;
}

.board-card p{
  color:#64748b;
  font-size:13px;
}

.board-code-input{
  text-align:center;
  font-size:24px;
  font-weight:800;
  letter-spacing:5px;
  text-transform:uppercase;
}

.live-box{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:16px;
  background:#ecfdf5;
  border:1px solid #a7f3d0;
  color:#047857;
  font-weight:700;
  text-align:center;
}

.footer{
  text-align:center;
  margin-top:25px;
  color:#94a3b8;
  font-size:11px;
}

@media(max-width:600px){

  body{
    padding:15px;
  }

  .container{
    padding:25px 18px;
    border-radius:20px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="brand-icon">DB</div>

    <div class="brand-title">
      <h1>Digital Board</h1>
      <span>College Management System</span>
    </div>
  </div>


  <!-- LOGIN / REGISTER -->

  <div id="authSection">

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showTab('login')">
        Login
      </button>

      <button
        class="tab"
        id="registerTab"
        onclick="showTab('register')">
        Register
      </button>

    </div>


    <!-- LOGIN -->

    <div
      class="form active"
      id="loginForm">

      <label>Gmail</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="Enter Gmail">

      <label>Password</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Enter Digital Board password">

      <button
        class="primary"
        onclick="loginUser()">
        Login
      </button>

    </div>


    <!-- REGISTER -->

    <div
      class="form"
      id="registerForm">

      <label>Full Name</label>

      <input
        type="text"
        id="registerName"
        placeholder="Enter full name">

      <label>Gmail</label>

      <input
        type="email"
        id="registerEmail"
        placeholder="example@gmail.com">

      <label>Mobile Number</label>

      <input
        type="tel"
        id="registerMobile"
        maxlength="10"
        placeholder="10 digit mobile number">

      <label>Digital Board Password</label>

      <input
        type="password"
        id="registerPassword"
        placeholder="Create your password">

      <button
        class="primary"
        onclick="registerUser()">
        Register
      </button>

    </div>


    <div
      id="message"
      class="message">
    </div>

  </div>


  <!-- BOARD ACCESS -->

  <div id="boardAccess">

    <div class="board-card">

      <h2>Digital Board Access</h2>

      <p>
        Enter the 6-character Board Code shown on the
        Digital Board.
      </p>

      <input
        class="board-code-input"
        id="boardCodeInput"
        maxlength="6"
        placeholder="ABC123">

      <button
        class="primary"
        onclick="verifyBoardCode()">
        Verify Board
      </button>

      <button
        class="secondary"
        onclick="startScreenShare()"
        id="shareButton"
        style="display:none;">
        Start Screen Share
      </button>

      <button
        class="secondary"
        onclick="stopScreenShare()"
        id="stopButton"
        style="display:none;">
        Stop Sharing
      </button>

      <div
        id="liveBox"
        class="live-box">
        ✓ Screen Sharing is Live
      </div>

      <div
        id="boardMessage"
        class="message">
      </div>

    </div>

  </div>


  <div class="footer">
    Digital Board Management System • College Project
  </div>

</div>

window.showTab = function(tab){

  document
    .getElementById("loginTab")
    .classList
    .toggle("active",tab === "login");

  document
    .getElementById("registerTab")
    .classList
    .toggle("active",tab === "register");

  document
    .getElementById("loginForm")
    .classList
    .toggle("active",tab === "login");

  document
    .getElementById("registerForm")
    .classList
    .toggle("active",tab === "register");

};


function showMessage(
  text,
  type="info"
){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message show " + type;

}


function showBoardMessage(
  text,

){

function showBoardAccess(){

}
