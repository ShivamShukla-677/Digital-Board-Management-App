<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Board Management</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      cursor: pointer;
      background: #e9ecef;
      font-size: 16px;
    }

    .tab.active {
      background: #2563eb;
      color: white;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button.main-btn {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.main-btn:hover {
      background: #1d4ed8;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 7px;
      display: none;
      text-align: center;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      background: #dbeafe;
      color: #1e40af;
    }

    .login-link {
      display: none;
      text-align: center;
      margin-top: 12px;
    }

    .login-link button {
      border: none;
      background: none;
      color: #2563eb;
      cursor: pointer;
      text-decoration: underline;
      font-size: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Digital Board Management</h1>

  <div class="tabs">
    <button class="tab active" id="registerTab">Register</button>
    <button class="tab" id="loginTab">Login</button>
  </div>

  <!-- REGISTER -->
  <div id="registerSection" class="form-section active">

    <label>Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label>Gmail</label>
    <input type="email" id="email" placeholder="example@gmail.com">

    <label>Mobile Number</label>
    <input type="tel" id="mobile" placeholder="10 digit mobile number" maxlength="10">

    <button class="main-btn" id="registerBtn">
      Verify Gmail & Register
    </button>

    <div id="registerMessage" class="message"></div>

    <div id="duplicateLogin" class="login-link">
      Already registered?
      <button id="goLogin">Login</button>
    </div>

  </div>


  <!-- LOGIN -->
  <div id="loginSection" class="form-section">

    <label>Gmail</label>
    <input type="email" id="loginEmail" placeholder="example@gmail.com">

    <button class="main-btn" id="loginBtn">
      Send Login Link
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</div>


<script type="module">

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    serverTimestamp
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

  import {
    getAuth,
    sendSignInLinkToEmail,
    isSignInWithEmailLink,
    signInWithEmailLink
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  // =========================
  // FIREBASE CONFIG
  // =========================

  const firebaseConfig = {
    apiKey: "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",
    authDomain: "digital-board-acces-management.firebaseapp.com",
    projectId: "digital-board-acces-management",
    storageBucket: "digital-board-acces-management.firebasestorage.app",
    messagingSenderId: "902348932290",
    appId: "1:902348932290:web:db47f1b012bf882886675b"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const auth = getAuth(app);


  // =========================
  // ELEMENTS
  // =========================

  const registerTab = document.getElementById("registerTab");
  const loginTab = document.getElementById("loginTab");

  const registerSection = document.getElementById("registerSection");
  const loginSection = document.getElementById("loginSection");

  const registerBtn = document.getElementById("registerBtn");
  const loginBtn = document.getElementById("loginBtn");

  const registerMessage = document.getElementById("registerMessage");
  const loginMessage = document.getElementById("loginMessage");

  const duplicateLogin = document.getElementById("duplicateLogin");
  const goLogin = document.getElementById("goLogin");


  // =========================
  // TAB SWITCH
  // =========================

  registerTab.addEventListener("click", () => {

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    registerSection.classList.add("active");
    loginSection.classList.remove("active");

  });


  loginTab.addEventListener("click", () => {

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    loginSection.classList.add("active");
    registerSection.classList.remove("active");

  });


  goLogin.addEventListener("click", () => {

    loginTab.click();

  });


  // =========================
  // MESSAGE FUNCTION
  // =========================

  function showMessage(element, message, type) {

    element.textContent = message;

    element.className = "message " + type;

    element.style.display = "block";

  }


  // =========================
  // CHECK DUPLICATE
  // =========================

  async function checkDuplicate(email, mobile) {

    const snapshot =
      await getDocs(collection(db, "registrationRequests"));

    for (const doc of snapshot.docs) {

      const data = doc.data();

      const existingEmail =
        (data.email || "").toLowerCase();

      const existingMobile =
        data.mobile || "";

      if (
        existingEmail === email.toLowerCase() ||
        existingMobile === mobile
      ) {

        return true;

      }

    }

    return false;

  }


  // =========================
  // REGISTER
  // =========================

  registerBtn.addEventListener("click", async () => {

    const name =
      document.getElementById("name").value.trim();

    const email =
      document.getElementById("email").value.trim().toLowerCase();

    const mobile =
      document.getElementById("mobile").value.trim();


    duplicateLogin.style.display = "none";


    // NAME CHECK

    if (!name) {

      showMessage(
        registerMessage,
        "Please enter your name.",
        "error"
      );

      return;

    }


    // GMAIL CHECK

    if (!email.endsWith("@gmail.com")) {

      showMessage(
        registerMessage,
        "Please use a valid Gmail address ending with @gmail.com.",
        "error"
      );

      return;

    }


    // MOBILE CHECK

    if (!/^[0-9]{10}$/.test(mobile)) {

      showMessage(
        registerMessage,
        "Mobile number must be exactly 10 digits.",
        "error"
      );

      return;

    }


    registerBtn.disabled = true;

    registerBtn.textContent = "Checking...";


    try {

      // CHECK DUPLICATE

      const duplicate =
        await checkDuplicate(email, mobile);


      if (duplicate) {

        showMessage(
          registerMessage,
          "Already exists. Please login.",
          "error"
        );

        duplicateLogin.style.display = "block";

        registerBtn.disabled = false;

        registerBtn.textContent =
          "Verify Gmail & Register";

        return;

      }


      // SAVE TEMP DATA

      localStorage.setItem(
        "pendingName",
        name
      );

      localStorage.setItem(
        "pendingMobile",
        mobile
      );


      // EMAIL VERIFICATION LINK

      const actionCodeSettings = {

        url:
          window.location.origin +
          window.location.pathname,

        handleCodeInApp: true

      };


      await sendSignInLinkToEmail(
        auth,
        email,
        actionCodeSettings
      );


      localStorage.setItem(
        "emailForSignIn",
        email
      );


      showMessage(
        registerMessage,
        "Verification link Gmail par bhej diya gaya hai. Apna Gmail open karke link par click karein.",
        "success"
      );


    } catch (error) {

      console.error(error);

      showMessage(
        registerMessage,
        "Unable to send Gmail verification link: " +
        error.message,
        "error"
      );

    }


    registerBtn.disabled = false;

    registerBtn.textContent =
      "Verify Gmail & Register";

  });


  // =========================
  // AFTER GMAIL LINK CLICK
  // =========================

  async function completeEmailVerification() {

    if (!isSignInWithEmailLink(auth, window.location.href)) {

      return;

    }


    let email =
      localStorage.getItem("emailForSignIn");


    if (!email) {

      email =
        prompt("Please enter your Gmail address:");

    }


    if (!email) {

      return;

    }


    try {

      showMessage(
        registerMessage,
        "Gmail verification complete ho rahi hai...",
        "info"
      );


      const result =
        await signInWithEmailLink(
          auth,
          email,
          window.location.href
        );


      const user =
        result.user;


      const name =
        localStorage.getItem("pendingName") || "";

      const mobile =
        localStorage.getItem("pendingMobile") || "";


      // DOUBLE CHECK DUPLICATE

      const duplicate =
        await checkDuplicate(email, mobile);


      if (duplicate) {

        showMessage(
          registerMessage,
          "Already exists. Please login.",
          "error"
        );

        duplicateLogin.style.display = "block";

        return;

      }


      // SAVE REGISTRATION REQUEST

      await addDoc(
        collection(db, "registrationRequests"),
        {
          uid: user.uid,
          name: name,
          email: email.toLowerCase(),
          mobile: mobile,
          verifiedBy: "gmail",
          status: "pending",
          createdAt: serverTimestamp()
        }
      );


      showMessage(
        registerMessage,
        "Gmail verified successfully! Your registration request has been sent to the Coordinator for approval.",
        "success"
      );


      // CLEAR TEMP DATA

      localStorage.removeItem("emailForSignIn");
      localStorage.removeItem("pendingName");
      localStorage.removeItem("pendingMobile");


    } catch (error) {

      console.error(error);

      showMessage(
        registerMessage,
        "Gmail verification failed: " +
        error.message,
        "error"
      );

    }

  }


  // RUN EMAIL VERIFICATION CHECK

  completeEmailVerification();


  // =========================
  // LOGIN
  // =========================

  loginBtn.addEventListener("click", async () => {

    const email =
      document.getElementById("loginEmail")
      .value
      .trim()
      .toLowerCase();


    if (!email.endsWith("@gmail.com")) {

      showMessage(
        loginMessage,
        "Please enter a valid Gmail address.",
        "error"
      );

      return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
      "Sending...";


    try {

      const actionCodeSettings = {

        url:
          window.location.origin +
          window.location.pathname,

        handleCodeInApp: true

      };


      await sendSignInLinkToEmail(
        auth,
        email,
        actionCodeSettings
      );


      localStorage.setItem(
        "loginEmail",
        email
      );


      showMessage(
        loginMessage,
        "Login link Gmail par bhej diya gaya hai.",
        "success"
      );


    } catch (error) {

      console.error(error);

      showMessage(
        loginMessage,
        "Unable to send login link: " +
        error.message,
        "error"
      );

    }


    loginBtn.disabled = false;

    loginBtn.textContent =
      "Send Login Link";

  });

</script>

</body>
</html>
