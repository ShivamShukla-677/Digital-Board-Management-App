<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board Management</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 380px;
      max-width: 92%;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 25px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      cursor: pointer;
      background: #e5e7eb;
      color: #111827;
      font-size: 15px;
    }

    .tab:first-child {
      border-radius: 7px 0 0 7px;
    }

    .tab:last-child {
      border-radius: 0 7px 7px 0;
    }

    .tab.active {
      background: #2563eb;
      color: white;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button.submit {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.submit:hover {
      background: #1d4ed8;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .error {
      color: #dc2626;
    }

    .success {
      color: #16a34a;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Digital Board Management</h1>

    <!-- LOGIN / REGISTER TABS -->

    <div class="tabs">

      <button
        class="tab active"
        id="loginTab"
        onclick="showLogin()">
        Login
      </button>

      <button
        class="tab"
        id="registerTab"
        onclick="showRegister()">
        Register
      </button>

    </div>


    <!-- LOGIN FORM -->

    <div class="form active" id="loginForm">

      <label>Email</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="Enter Gmail"
      >

      <label>Password</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Enter password"
      >

      <button
        class="submit"
        onclick="loginUser()">
        Login
      </button>

      <div id="loginMessage" class="message"></div>

    </div>


    <!-- REGISTER FORM -->

    <div class="form" id="registerForm">

      <label>Full Name</label>

      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
      >


      <label>Gmail</label>

      <input
        type="email"
        id="email"
        placeholder="example@gmail.com"
      >


      <label>Mobile Number</label>

      <input
        type="tel"
        id="mobile"
        placeholder="10 digit mobile number"
        maxlength="10"
      >


      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Create password"
      >


      <button
        class="submit"
        onclick="registerUser()">
        Register
      </button>

      <div id="registerMessage" class="message"></div>

    </div>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc
    }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // FIREBASE CONFIG

    const firebaseConfig = {
      apiKey: "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",
      authDomain: "digital-board-acces-management.firebaseapp.com",
      projectId: "digital-board-acces-management",
      storageBucket: "digital-board-acces-management.firebasestorage.app",
      messagingSenderId: "902348932290",
      appId: "1:902348932290:web:db47f1b012bf882886675b"
    };


    // START FIREBASE

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // SWITCH TO LOGIN

    window.showLogin = function() {

      document
        .getElementById("loginForm")
        .classList.add("active");

      document
        .getElementById("registerForm")
        .classList.remove("active");

      document
        .getElementById("loginTab")
        .classList.add("active");

      document
        .getElementById("registerTab")
        .classList.remove("active");

    };


    // SWITCH TO REGISTER

    window.showRegister = function() {

      document
        .getElementById("registerForm")
        .classList.add("active");

      document
        .getElementById("loginForm")
        .classList.remove("active");

      document
        .getElementById("registerTab")
        .classList.add("active");

      document
        .getElementById("loginTab")
        .classList.remove("active");

    };


    // REGISTER

    window.registerUser = async function() {

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const mobile =
        document.getElementById("mobile").value.trim();

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("registerMessage");


      message.className = "message";


      // NAME CHECK

      if (name === "") {

        message.classList.add("error");

        message.innerText =
          "⚠️ Please enter your name.";

        return;
      }


      // GMAIL CHECK

      if (!email.toLowerCase().endsWith("@gmail.com")) {

        message.classList.add("error");

        message.innerText =
          "⚠️ Please enter a valid Gmail ending with @gmail.com.";

        return;
      }


      // MOBILE CHECK

      if (!/^[0-9]{10}$/.test(mobile)) {

        message.classList.add("error");

        message.innerText =
          "⚠️ Mobile number must contain exactly 10 digits.";

        return;
      }


      // PASSWORD CHECK

      if (password.length < 6) {

        message.classList.add("error");

        message.innerText =
          "⚠️ Password must contain at least 6 characters.";

        return;
      }


      message.innerText = "Creating account...";


      try {

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        // SAVE USER DATA

        await setDoc(
          doc(db, "users", user.uid),
          {
            name: name,
            email: email,
            mobile: mobile,
            status: "pending",
            createdAt: new Date()
          }
        );


        message.classList.add("success");

        message.innerText =
          "✅ Registration successful! Waiting for coordinator approval.";


        document
          .getElementById("name")
          .value = "";

        document
          .getElementById("email")
          .value = "";

        document
          .getElementById("mobile")
          .value = "";

        document
          .getElementById("password")
          .value = "";


      } catch (error) {

        console.error(error);

        message.classList.add("error");

        if (error.code === "auth/email-already-in-use") {

          message.innerText =
            "⚠️ This Gmail is already registered.";

        } else {

          message.innerText =
            "⚠️ " + error.message;
        }

      }

    };


    // LOGIN

    window.loginUser = async function() {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;

      const message =
        document.getElementById("loginMessage");


      message.className = "message";


      // GMAIL CHECK

      if (!email.toLowerCase().endsWith("@gmail.com")) {

        message.classList.add("error");

        message.innerText =
          "⚠️ Please enter a valid Gmail.";

        return;
      }


      if (password === "") {

        message.classList.add("error");

        message.innerText =
          "⚠️ Please enter your password.";

        return;
      }


      message.innerText = "Logging in...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        message.classList.add("success");

        message.innerText =
          "✅ Login successful!";


      } catch (error) {

        console.error(error);

        message.classList.add("error");

        message.innerText =
          "⚠️ Invalid Gmail or password.";

      }

    };

  </script>

</body>
</html>
