<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board Management</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: none;
      cursor: pointer;
      background: #ddd;
      font-size: 16px;
    }

    .tab.active {
      background: #007bff;
      color: white;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button.main-btn {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button.main-btn:hover {
      background: #0056b3;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 7px;
      display: none;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    .info {
      background: #d1ecf1;
      color: #0c5460;
    }

    .login-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #007bff;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Digital Board Management</h1>

  <div class="tabs">
    <button class="tab active" id="loginTab">Login</button>
    <button class="tab" id="registerTab">Register</button>
  </div>


  <!-- LOGIN -->
  <div class="form active" id="loginForm">

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter Gmail"
      autocomplete="email"
    >

    <button class="main-btn" id="loginBtn">
      Send Login / Verification Link
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- REGISTER -->
  <div class="form" id="registerForm">

    <input
      type="text"
      id="name"
      placeholder="Enter your name"
    >

    <input
      type="email"
      id="registerEmail"
      placeholder="Enter Gmail"
      autocomplete="email"
    >

    <input
      type="tel"
      id="mobile"
      placeholder="Enter 10 digit mobile number"
      maxlength="10"
    >

    <button class="main-btn" id="registerBtn">
      Register
    </button>

    <div id="registerMessage" class="message"></div>

    <span class="login-link" id="goToLogin">
      Already registered? Login
    </span>

  </div>

</div>


<script type="module">

  /* =========================================
     FIREBASE IMPORTS
  ========================================= */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    sendSignInLinkToEmail,
    isSignInWithEmailLink,
    signInWithEmailLink,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================= */

  const firebaseConfig = {
    apiKey: "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",
    authDomain: "digital-board-acces-management.firebaseapp.com",
    projectId: "digital-board-acces-management",
    storageBucket: "digital-board-acces-management.firebasestorage.app",
    messagingSenderId: "902348932290",
    appId: "1:902348932290:web:db47f1b012bf882886675b"
  };


  /* =========================================
     INITIALIZE FIREBASE
  ========================================= */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* =========================================
     COORDINATOR EMAIL
  ========================================= */

  const COORDINATOR_EMAIL =
    "anujshivamshukla99359@gmail.com";


  /* =========================================
     EMAIL LINK SETTINGS
  ========================================= */

  const actionCodeSettings = {

    url:
      "https://shivamshukla-677.github.io/Digital-Board-Management-App/",

    handleCodeInApp: true

  };


  /* =========================================
     ELEMENTS
  ========================================= */

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");

  const loginForm =
    document.getElementById("loginForm");

  const registerForm =
    document.getElementById("registerForm");

  const goToLogin =
    document.getElementById("goToLogin");


  /* =========================================
     TAB SWITCHING
  ========================================= */

  loginTab.addEventListener("click", () => {

    loginTab.classList.add("active");

    registerTab.classList.remove("active");

    loginForm.classList.add("active");

    registerForm.classList.remove("active");

  });


  registerTab.addEventListener("click", () => {

    registerTab.classList.add("active");

    loginTab.classList.remove("active");

    registerForm.classList.add("active");

    loginForm.classList.remove("active");

  });


  goToLogin.addEventListener("click", () => {

    loginTab.click();

  });


  /* =========================================
     MESSAGE FUNCTION
  ========================================= */

  function showMessage(
    elementId,
    message,
    type
  ) {

    const element =
      document.getElementById(elementId);

    element.textContent = message;

    element.className =
      "message " + type;

    element.style.display = "block";

  }


  /* =========================================
     REGISTER
  ========================================= */

  document
    .getElementById("registerBtn")
    .addEventListener("click", async () => {

      const name =
        document
          .getElementById("name")
          .value
          .trim();

      const email =
        document
          .getElementById("registerEmail")
          .value
          .trim()
          .toLowerCase();

      const mobile =
        document
          .getElementById("mobile")
          .value
          .trim();


      /* NAME */

      if (!name) {

        showMessage(
          "registerMessage",
          "Please enter your name.",
          "error"
        );

        return;
      }


      /* GMAIL */

      if (
        !email.endsWith("@gmail.com")
      ) {

        showMessage(
          "registerMessage",
          "Please use a valid Gmail address ending with @gmail.com.",
          "error"
        );

        return;
      }


      /* MOBILE */

      if (
        !/^[0-9]{10}$/.test(mobile)
      ) {

        showMessage(
          "registerMessage",
          "Mobile number must be exactly 10 digits.",
          "error"
        );

        return;
      }


      try {

        showMessage(
          "registerMessage",
          "Checking your details...",
          "info"
        );


        /* CHECK EMAIL */

        const emailQuery = query(
          collection(db, "registrationRequests"),
          where("email", "==", email)
        );

        const emailSnapshot =
          await getDocs(emailQuery);


        if (!emailSnapshot.empty) {

          showMessage(
            "registerMessage",
            "Already exists. Please login.",
            "error"
          );

          return;
        }


        /* CHECK MOBILE */

        const mobileQuery = query(
          collection(db, "registrationRequests"),
          where("mobile", "==", mobile)
        );

        const mobileSnapshot =
          await getDocs(mobileQuery);


        if (!mobileSnapshot.empty) {

          showMessage(
            "registerMessage",
            "Already exists. Please login.",
            "error"
          );

          return;
        }


        /* SAVE TEMP DATA */

        localStorage.setItem(
          "pendingName",
          name
        );

        localStorage.setItem(
          "pendingMobile",
          mobile
        );

        localStorage.setItem(
          "emailForSignIn",
          email
        );

        localStorage.setItem(
          "loginType",
          "registration"
        );


        /* SEND EMAIL LINK */

        await sendSignInLinkToEmail(
          auth,
          email,
          actionCodeSettings
        );


        showMessage(
          "registerMessage",
          "Verification link sent to your Gmail. Please check your inbox and open the latest link.",
          "success"
        );

      }

      catch (error) {

        console.error(error);

        showMessage(
          "registerMessage",
          "Error: " + error.message,
          "error"
        );

      }

    });


  /* =========================================
     LOGIN
  ========================================= */

  document
    .getElementById("loginBtn")
    .addEventListener("click", async () => {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim()
          .toLowerCase();


      if (!email) {

        showMessage(
          "loginMessage",
          "Please enter your Gmail.",
          "error"
        );

        return;
      }


      if (!email.endsWith("@gmail.com")) {

        showMessage(
          "loginMessage",
          "Please use a valid Gmail address.",
          "error"
        );

        return;
      }


      try {

        showMessage(
          "loginMessage",
          "Checking account...",
          "info"
        );


        /* =====================================
           IMPORTANT:
           COORDINATOR CHECK FIRST
        ===================================== */

        if (
          email === COORDINATOR_EMAIL
        ) {

          localStorage.setItem(
            "emailForSignIn",
            COORDINATOR_EMAIL
          );

          localStorage.setItem(
            "loginType",
            "coordinator"
          );


          await sendSignInLinkToEmail(
            auth,
            COORDINATOR_EMAIL,
            actionCodeSettings
          );


          showMessage(
            "loginMessage",
            "Coordinator verification link sent. Please check your Gmail and open the latest email link.",
            "success"
          );

          return;
        }


        /* =====================================
           NORMAL USER CHECK
        ===================================== */

        const userQuery = query(
          collection(db, "registrationRequests"),
          where("email", "==", email)
        );

        const userSnapshot =
          await getDocs(userQuery);


        if (userSnapshot.empty) {

          showMessage(
            "loginMessage",
            "You are not registered. Please register first.",
            "error"
          );

          return;
        }


        let userData = null;

        userSnapshot.forEach((doc) => {

          userData = doc.data();

        });


        if (userData.status === "pending") {

          showMessage(
            "loginMessage",
            "Your registration is still pending Coordinator approval.",
            "info"
          );

          return;
        }


        if (userData.status === "rejected") {

          showMessage(
            "loginMessage",
            "Your registration has been rejected.",
            "error"
          );

          return;
        }


        if (userData.status !== "approved") {

          showMessage(
            "loginMessage",
            "Your account is not approved yet.",
            "error"
          );

          return;
        }


        /* APPROVED USER */

        localStorage.setItem(
          "emailForSignIn",
          email
        );

        localStorage.setItem(
          "loginType",
          "user"
        );


        await sendSignInLinkToEmail(
          auth,
          email,
          actionCodeSettings
        );


        showMessage(
          "loginMessage",
          "Login verification link sent to your Gmail.",
          "success"
        );

      }

      catch (error) {

        console.error(error);

        showMessage(
          "loginMessage",
          "Error: " + error.message,
          "error"
        );

      }

    });


  /* =========================================
     PROCESS EMAIL VERIFICATION LINK
  ========================================= */

  async function processEmailLink() {

    if (
      !isSignInWithEmailLink(
        auth,
        window.location.href
      )
    ) {

      return;

    }


    try {

      let email =
        localStorage.getItem(
          "emailForSignIn"
        );


      /* If email is missing */

      if (!email) {

        email = window.prompt(
          "Please enter the Gmail address where you received this verification link:"
        );

      }


      if (!email) {

        alert(
          "Email address is required to complete verification."
        );

        return;

      }


      email =
        email.trim().toLowerCase();


      /* =====================================
         COMPLETE FIREBASE EMAIL LOGIN
      ===================================== */

      const result =
        await signInWithEmailLink(
          auth,
          email,
          window.location.href
        );


      const verifiedEmail =
        result.user.email
          .trim()
          .toLowerCase();


      console.log(
        "Verified email:",
        verifiedEmail
      );


      /* =====================================
         COORDINATOR
      ===================================== */

      if (
        verifiedEmail ===
        COORDINATOR_EMAIL
      ) {

        localStorage.removeItem(
          "emailForSignIn"
        );

        localStorage.removeItem(
          "loginType"
        );

        localStorage.removeItem(
          "pendingName"
        );

        localStorage.removeItem(
          "pendingMobile"
        );


        alert(
          "Coordinator verification successful!"
        );


        window.location.href =
          "coordinator.html";


        return;

      }


      /* =====================================
         NORMAL USER REGISTRATION
      ===================================== */

      const loginType =
        localStorage.getItem(
          "loginType"
        );


      if (
        loginType ===
        "registration"
      ) {

        const name =
          localStorage.getItem(
            "pendingName"
          );

        const mobile =
          localStorage.getItem(
            "pendingMobile"
          );


        if (!name || !mobile) {

          alert(
            "Registration information is missing. Please register again."
          );

          return;

        }


        /* Check again before creating */

        const existingQuery =
          query(
            collection(
              db,
              "registrationRequests"
            ),
            where(
              "email",
              "==",
              verifiedEmail
            )
          );


        const existingSnapshot =
          await getDocs(
            existingQuery
          );


        if (
          existingSnapshot.empty
        ) {

          await addDoc(
            collection(
              db,
              "registrationRequests"
            ),
            {

              uid: result.user.uid,

              name: name,

              email: verifiedEmail,

              mobile: mobile,

              verifiedBy: "gmail",

              status: "pending",

              createdAt:
                serverTimestamp()

            }
          );

        }


        localStorage.removeItem(
          "emailForSignIn"
        );

        localStorage.removeItem(
          "loginType"
        );

        localStorage.removeItem(
          "pendingName"
        );

        localStorage.removeItem(
          "pendingMobile"
        );


        alert(
          "Gmail verification successful! Your registration has been sent to the Coordinator for approval."
        );


        window.location.href =
          "index.html";


        return;

      }


      /* =====================================
         NORMAL USER LOGIN
      ===================================== */

      if (
        loginType ===
        "user"
      ) {

        localStorage.removeItem(
          "emailForSignIn"
        );

        localStorage.removeItem(
          "loginType"
        );


        alert(
          "Login successful!"
        );


        /*
          USER DASHBOARD WILL BE CONNECTED
          HERE LATER.
        */

        window.location.href =
          "index.html";

        return;

      }


    }

    catch (error) {

      console.error(
        "Email verification error:",
        error
      );


      if (
        error.code ===
        "auth/invalid-action-code"
      ) {

        alert(
          "This verification link is invalid, expired, or has already been used. Please request a new verification link and open the latest email."
        );

      }

      else if (
        error.code ===
        "auth/expired-action-code"
      ) {

        alert(
          "This verification link has expired. Please request a new link."
        );

      }

      else {

        alert(
          "Verification failed: " +
          error.message
        );

      }

    }

  }


  /* =========================================
     RUN EMAIL LINK CHECK
  ========================================= */

  processEmailLink();


</script>

</body>
</html>
