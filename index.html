<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Board Management</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1, h2 {
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background: #1976d2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #125ca5;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tabs button {
      margin: 0;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      display: none;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    .info {
      background: #dbeafe;
      color: #1e40af;
    }

    .hidden {
      display: none;
    }

    .board-box {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
    }

    #videoPreview {
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
      background: black;
      display: none;
    }

    #stopShareBtn {
      background: #dc3545;
    }

    #stopShareBtn:hover {
      background: #b52a37;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Digital Board Management</h1>

  <div class="tabs">
    <button onclick="showLogin()">Login</button>
    <button onclick="showRegister()">Register</button>
  </div>

  <!-- LOGIN -->
  <div id="loginSection">

    <h2>Login</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter Gmail"
    >

    <button onclick="loginUser()">Login</button>

  </div>


  <!-- REGISTER -->
  <div id="registerSection" class="hidden">

    <h2>Register</h2>

    <input
      type="text"
      id="regName"
      placeholder="Enter Name"
    >

    <input
      type="email"
      id="regEmail"
      placeholder="Enter Gmail"
    >

    <input
      type="text"
      id="regMobile"
      placeholder="Enter 10 digit Mobile Number"
      maxlength="10"
    >

    <button onclick="registerUser()">Register</button>

  </div>


  <!-- MESSAGE -->
  <div id="message" class="message"></div>


  <!-- APPROVED USER BOARD ACCESS -->
  <div id="boardAccess" class="board-box hidden">

    <h2>Board Access</h2>

    <p>
      Your registration has been approved.
    </p>

    <input
      type="text"
      id="boardCode"
      placeholder="Enter 6-character Board Code"
      maxlength="6"
      style="text-transform: uppercase;"
    >

    <button onclick="checkBoardCode()">
      Verify Board Code
    </button>

    <div id="shareArea" class="hidden">

      <button onclick="startScreenShare()">
        Screen Share
      </button>

      <button
        id="stopShareBtn"
        onclick="stopScreenShare()"
        class="hidden"
      >
        Stop Sharing
      </button>

      <video
        id="videoPreview"
        autoplay
        muted
        playsinline
      ></video>

    </div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    onSnapshot,
    serverTimestamp,
    addDoc as addFirestoreDoc
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  // =========================
  // FIREBASE CONFIG
  // =========================

  const firebaseConfig = {
    apiKey: "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",
    authDomain: "digital-board-acces-management.firebaseapp.com",
    projectId: "digital-board-acces-management",
    storageBucket: "digital-board-acces-management.firebasestorage.app",
    messagingSenderId: "902348932290",
    appId: "1:902348932290:web:db47f1b012bf882886675b"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  // =========================
  // TEMPORARY PASSWORD
  // =========================

  const TEMP_PASSWORD = "password123456";

  const COORDINATOR_EMAIL =
    "anujshivamshukla99359@gmail.com";


  let currentBoardCode = null;
  let peerConnection = null;
  let screenStream = null;


  // =========================
  // UI
  // =========================

  window.showLogin = function () {

    document
      .getElementById("loginSection")
      .classList.remove("hidden");

    document
      .getElementById("registerSection")
      .classList.add("hidden");

    hideMessage();
  };


  window.showRegister = function () {

    document
      .getElementById("registerSection")
      .classList.remove("hidden");

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    hideMessage();
  };


  function showMessage(text, type = "info") {

    const box = document.getElementById("message");

    box.textContent = text;

    box.className = "message " + type;

    box.style.display = "block";
  }


  function hideMessage() {

    const box = document.getElementById("message");

    box.style.display = "none";
  }


  // =========================
  // EMAIL VALIDATION
  // =========================

  function validGmail(email) {

    return /^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(email);
  }


  // =========================
  // REGISTER
  // =========================

  window.registerUser = async function () {

    const name =
      document.getElementById("regName").value.trim();

    const email =
      document.getElementById("regEmail").value.trim().toLowerCase();

    const mobile =
      document.getElementById("regMobile").value.trim();


    if (!name || !email || !mobile) {

      showMessage(
        "Please fill all fields.",
        "error"
      );

      return;
    }


    if (!validGmail(email)) {

      showMessage(
        "Please enter a valid Gmail address.",
        "error"
      );

      return;
    }


    if (!/^\d{10}$/.test(mobile)) {

      showMessage(
        "Mobile number must be exactly 10 digits.",
        "error"
      );

      return;
    }


    try {

      // Check duplicate Gmail

      const emailQuery = query(
        collection(db, "registrationRequests"),
        where("email", "==", email)
      );

      const emailSnapshot =
        await getDocs(emailQuery);


      if (!emailSnapshot.empty) {

        showMessage(
          "Already exists. Please login.",
          "error"
        );

        return;
      }


      // Check duplicate mobile

      const mobileQuery = query(
        collection(db, "registrationRequests"),
        where("mobile", "==", mobile)
      );

      const mobileSnapshot =
        await getDocs(mobileQuery);


      if (!mobileSnapshot.empty) {

        showMessage(
          "Already exists. Please login.",
          "error"
        );

        return;
      }


      // Create Firebase account

      let userCredential;

      try {

        userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            TEMP_PASSWORD
          );

      } catch (error) {

        if (error.code === "auth/email-already-in-use") {

          showMessage(
            "Already exists. Please login.",
            "error"
          );

          return;
        }

        throw error;
      }


      const uid = userCredential.user.uid;


      // Registration request

      await addDoc(
        collection(db, "registrationRequests"),
        {
          uid: uid,
          name: name,
          email: email,
          mobile: mobile,

          verification:
            "Temporary Password",

          status: "pending",

          createdAt: serverTimestamp()
        }
      );


      await signOut(auth);


      showMessage(
        "Registration successful. Coordinator approval pending.",
        "success"
      );


      document.getElementById("regName").value = "";
      document.getElementById("regEmail").value = "";
      document.getElementById("regMobile").value = "";

    } catch (error) {

      console.error(error);

      showMessage(
        "Registration failed: " + error.message,
        "error"
      );
    }

  };


  // =========================
  // LOGIN
  // =========================

  window.loginUser = async function () {

    const email =
      document.getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();


    if (!validGmail(email)) {

      showMessage(
        "Please enter a valid Gmail address.",
        "error"
      );

      return;
    }


    try {

      // =========================
      // COORDINATOR LOGIN
      // =========================

      if (email === COORDINATOR_EMAIL) {

        await signInWithEmailAndPassword(
          auth,
          email,
          TEMP_PASSWORD
        );


        window.location.href =
          "coordinator.html";

        return;
      }


      // =========================
      // NORMAL USER
      // =========================

      const userQuery = query(
        collection(db, "registrationRequests"),
        where("email", "==", email)
      );


      const snapshot =
        await getDocs(userQuery);


      if (snapshot.empty) {

        showMessage(
          "You are not registered. Please register first.",
          "error"
        );

        return;
      }


      const userData =
        snapshot.docs[0].data();


      // Pending

      if (userData.status === "pending") {

        showMessage(
          "Your registration is pending coordinator approval.",
          "info"
        );

        return;
      }


      // Rejected

      if (userData.status === "rejected") {

        showMessage(
          "Your registration has been rejected.",
          "error"
        );

        return;
      }


      // Deleted / unknown

      if (userData.status !== "approved") {

        showMessage(
          "You are not authorized to access the board.",
          "error"
        );

        return;
      }


      // Login

      await signInWithEmailAndPassword(
        auth,
        email,
        TEMP_PASSWORD
      );


      showMessage(
        "Login successful.",
        "success"
      );


      document
        .getElementById("boardAccess")
        .classList.remove("hidden");


      document
        .getElementById("loginSection")
        .classList.add("hidden");


    } catch (error) {

      console.error(error);

      if (
        error.code === "auth/invalid-credential" ||
        error.code === "auth/wrong-password" ||
        error.code === "auth/user-not-found"
      ) {

        showMessage(
          "Login failed. This account needs the temporary password set in Firebase Authentication.",
          "error"
        );

      } else {

        showMessage(
          "Login failed: " + error.message,
          "error"
        );
      }
    }

  };


  // =========================
  // BOARD CODE CHECK
  // =========================

  window.checkBoardCode = async function () {

    const code =
      document.getElementById("boardCode")
        .value
        .trim()
        .toUpperCase();


    if (code.length !== 6) {

      showMessage(
        "Board code must be exactly 6 characters.",
        "error"
      );

      return;
    }


    try {

      const boardRef =
        doc(db, "boards", code);

      const boardSnap =
        await getDoc(boardRef);


      if (
        !boardSnap.exists() ||
        boardSnap.data().status !== "available"
      ) {

        showMessage(
          "Invalid or inactive board code.",
          "error"
        );

        return;
      }


      currentBoardCode = code;


      showMessage(
        "Board code verified. Screen Share is available.",
        "success"
      );


      document
        .getElementById("shareArea")
        .classList.remove("hidden");


    } catch (error) {

      console.error(error);

      showMessage(
        "Board code verification failed: " + error.message,
        "error"
      );
    }

  };


  // =========================
  // SCREEN SHARE
  // =========================

  window.startScreenShare = async function () {

    if (!currentBoardCode) {

      showMessage(
        "Please verify the board code first.",
        "error"
      );

      return;
    }


    try {

      screenStream =
        await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });


      const video =
        document.getElementById("videoPreview");


      video.srcObject = screenStream;

      video.style.display = "block";


      document
        .getElementById("stopShareBtn")
        .classList.remove("hidden");


      peerConnection =
        new RTCPeerConnection({
          iceServers: [
            {
              urls:
                "stun:stun.l.google.com:19302"
            }
          ]
        });


      // Add screen tracks

      screenStream
        .getTracks()
        .forEach(track => {

          peerConnection.addTrack(
            track,
            screenStream
          );

        });


      // Teacher ICE candidates

      peerConnection.onicecandidate =
        async event => {

          if (!event.candidate) return;


          await addDoc(
            collection(
              db,
              "sessions",
              currentBoardCode,
              "teacherCandidates"
            ),
            event.candidate.toJSON()
          );

        };


      // Create offer

      const offer =
        await peerConnection.createOffer();


      await peerConnection.setLocalDescription(
        offer
      );


      const sessionRef =
        doc(
          db,
          "sessions",
          currentBoardCode
        );


      await setDoc(
        sessionRef,
        {
          offer: {
            type: offer.type,
            sdp: offer.sdp
          },

          status: "active",

          createdAt:
            serverTimestamp()
        }
      );


      // Listen for board answer

      onSnapshot(
        sessionRef,
        async snapshot => {

          const data = snapshot.data();

          if (!data) return;


          if (
            data.answer &&
            !peerConnection.currentRemoteDescription
          ) {

            await peerConnection.setRemoteDescription(
              new RTCSessionDescription(
                data.answer
              )
            );

          }

        }
      );


      // Board ICE candidates

      onSnapshot(
        collection(
          db,
          "sessions",
          currentBoardCode,
          "boardCandidates"
        ),
        snapshot => {

          snapshot.docChanges().forEach(
            async change => {

              if (change.type !== "added")
                return;

              try {

                await peerConnection.addIceCandidate(
                  new RTCIceCandidate(
                    change.doc.data()
                  )
                );

              } catch (e) {

                console.log(
                  "ICE error:",
                  e
                );

              }

            }
          );

        }
      );


      // Stop if browser stops sharing

      screenStream
        .getVideoTracks()[0]
        .addEventListener(
          "ended",
          () => {

            stopScreenShare();

          }
        );


    } catch (error) {

      console.error(error);

      showMessage(
        "Screen sharing failed: " + error.message,
        "error"
      );
    }

  };


  // =========================
  // STOP SCREEN SHARE
  // =========================

  window.stopScreenShare = async function () {

    try {

      if (screenStream) {

        screenStream
          .getTracks()
          .forEach(track => track.stop());

        screenStream = null;
      }


      if (peerConnection) {

        peerConnection.close();

        peerConnection = null;
      }


      if (currentBoardCode) {

        await updateDoc(
          doc(
            db,
            "sessions",
            currentBoardCode
          ),
          {
            status: "ended"
          }
        ).catch(() => {});

      }


      const video =
        document.getElementById("videoPreview");


      video.srcObject = null;

      video.style.display = "none";


      document
        .getElementById("stopShareBtn")
        .classList.add("hidden");


      showMessage(
        "Screen sharing stopped.",
        "info"
      );


    } catch (error) {

      console.error(error);

    }

  };

</script>

</body>
</html>
