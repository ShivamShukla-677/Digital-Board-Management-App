<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board Management</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      width: 50%;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      color: #777;
    }

    .tab.active {
      color: #2563eb;
      border-bottom: 3px solid #2563eb;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .login-link {
      text-align: center;
      margin-top: 15px;
      display: none;
    }

    .login-link a {
      color: #2563eb;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Digital Board Management</h1>

  <div class="tabs">
    <div class="tab active" id="loginTab">Login</div>
    <div class="tab" id="registerTab">Register</div>
  </div>

  <!-- LOGIN -->
  <div class="form active" id="loginForm">

    <label>Gmail</label>
    <input
      type="email"
      id="loginEmail"
      placeholder="Enter your Gmail"
    >

    <button id="loginBtn">
      Send Verification Link
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- REGISTER -->
  <div class="form" id="registerForm">

    <label>Name</label>
    <input
      type="text"
      id="name"
      placeholder="Enter your name"
    >

    <label>Gmail</label>
    <input
      type="email"
      id="email"
      placeholder="example@gmail.com"
    >

    <label>Mobile Number</label>
    <input
      type="tel"
      id="mobile"
      placeholder="10 digit mobile number"
      maxlength="10"
    >

    <button id="registerBtn">
      Register & Verify Gmail
    </button>

    <div id="registerMessage" class="message"></div>

    <div class="login-link" id="alreadyLogin">
      Already registered?
      <a id="goLogin">Login here</a>
    </div>

  </div>

</div>


<script type="module">

  /* =====================================================
     FIREBASE IMPORTS
  ===================================================== */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    sendSignInLinkToEmail,
    isSignInWithEmailLink,
    signInWithEmailLink,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* =====================================================
     FIREBASE CONFIG
  ===================================================== */

  const firebaseConfig = {
    apiKey: "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",
    authDomain: "digital-board-acces-management.firebaseapp.com",
    projectId: "digital-board-acces-management",
    storageBucket: "digital-board-acces-management.firebasestorage.app",
    messagingSenderId: "902348932290",
    appId: "1:902348932290:web:db47f1b012bf882886675b"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* =====================================================
     IMPORTANT:
     COORDINATOR EMAIL
     
     EXACTLY AS YOU PROVIDED:
     @gamil.com
  ===================================================== */

  const COORDINATOR_EMAIL =
    "anujshivamshukla99359@gamil.com";


  /* =====================================================
     EMAIL LINK SETTINGS
  ===================================================== */

  const actionCodeSettings = {

    url:
      window.location.origin +
      window.location.pathname,

    handleCodeInApp: true

  };


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");

  const loginForm =
    document.getElementById("loginForm");

  const registerForm =
    document.getElementById("registerForm");

  const loginBtn =
    document.getElementById("loginBtn");

  const registerBtn =
    document.getElementById("registerBtn");

  const goLogin =
    document.getElementById("goLogin");


  /* =====================================================
     TAB SWITCHING
  ===================================================== */

  loginTab.addEventListener("click", () => {

    loginTab.classList.add("active");
    registerTab.classList.remove("active");

    loginForm.classList.add("active");
    registerForm.classList.remove("active");

  });


  registerTab.addEventListener("click", () => {

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    registerForm.classList.add("active");
    loginForm.classList.remove("active");

  });


  goLogin.addEventListener("click", () => {

    loginTab.click();

  });


  /* =====================================================
     MESSAGE FUNCTION
  ===================================================== */

  function showMessage(id, text, type) {

    const box =
      document.getElementById(id);

    box.textContent = text;

    box.className =
      "message " + type;

  }


  /* =====================================================
     LOGIN
     
     VERY IMPORTANT:
     
     COORDINATOR CHECK IS DONE FIRST.
     
     FIRESTORE REGISTRATION CHECK WILL NOT RUN
     FOR COORDINATOR.
  ===================================================== */

  loginBtn.addEventListener("click", async () => {

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();


    if (!email) {

      showMessage(
        "loginMessage",
        "Please enter your Gmail.",
        "error"
      );

      return;
    }


    /* =================================================
       COORDINATOR DIRECT FLOW
       
       THIS RUNS BEFORE ANY FIRESTORE CHECK.
    ================================================= */

    if (email === COORDINATOR_EMAIL) {

      try {

        /*
          Save coordinator email so Firebase can
          complete passwordless sign-in when the
          verification link is opened.
        */

        localStorage.setItem(
          "emailForSignIn",
          email
        );

        localStorage.setItem(
          "loginType",
          "coordinator"
        );


        /*
          SEND VERIFICATION LINK
        */

        await sendSignInLinkToEmail(
          auth,
          email,
          actionCodeSettings
        );


        showMessage(
          "loginMessage",
          "Coordinator verification link sent. Please check your email and open the link.",
          "success"
        );


      } catch (error) {

        console.error(error);

        showMessage(
          "loginMessage",
          "Unable to send verification link: " +
          error.message,
          "error"
        );

      }

      /*
        VERY IMPORTANT:
        STOP HERE.
        
        Firestore registration check will NOT happen.
      */

      return;
    }


    /* =================================================
       NORMAL USER LOGIN
    ================================================= */

    try {

      const usersRef =
        collection(
          db,
          "registrationRequests"
        );


      const q =
        query(
          usersRef,
          where("email", "==", email)
        );


      const snapshot =
        await getDocs(q);


      if (snapshot.empty) {

        showMessage(
          "loginMessage",
          "You are not registered. Please register first.",
          "error"
        );

        return;
      }


      let userData = null;


      snapshot.forEach(doc => {

        userData = doc.data();

      });


      if (userData.status !== "approved") {

        if (userData.status === "pending") {

          showMessage(
            "loginMessage",
            "Your registration is still pending approval.",
            "info"
          );

        } else if (userData.status === "rejected") {

          showMessage(
            "loginMessage",
            "Your registration has been rejected.",
            "error"
          );

        } else {

          showMessage(
            "loginMessage",
            "You are not approved yet.",
            "error"
          );

        }

        return;
      }


      /*
        Approved user
      */

      localStorage.setItem(
        "emailForSignIn",
        email
      );

      localStorage.setItem(
        "loginType",
        "user"
      );


      await sendSignInLinkToEmail(
        auth,
        email,
        actionCodeSettings
      );


      showMessage(
        "loginMessage",
        "Login verification link sent. Please check your Gmail.",
        "success"
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "loginMessage",
        "Error: " + error.message,
        "error"
      );

    }

  });


  /* =====================================================
     REGISTER
  ===================================================== */

  registerBtn.addEventListener("click", async () => {

    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const email =
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();


    const mobile =
      document
        .getElementById("mobile")
        .value
        .trim();


    /* NAME */

    if (!name) {

      showMessage(
        "registerMessage",
        "Please enter your name.",
        "error"
      );

      return;
    }


    /* GMAIL */

    if (!email.endsWith("@gmail.com")) {

      showMessage(
        "registerMessage",
        "Please use a valid @gmail.com address.",
        "error"
      );

      return;
    }


    /* MOBILE */

    if (!/^[0-9]{10}$/.test(mobile)) {

      showMessage(
        "registerMessage",
        "Mobile number must be exactly 10 digits.",
        "error"
      );

      return;
    }


    try {

      /* ===============================================
         CHECK DUPLICATE EMAIL
      =============================================== */

      const usersRef =
        collection(
          db,
          "registrationRequests"
        );


      const emailQuery =
        query(
          usersRef,
          where("email", "==", email)
        );


      const emailSnapshot =
        await getDocs(emailQuery);


      if (!emailSnapshot.empty) {

        showMessage(
          "registerMessage",
          "Already exists. Please login.",
          "error"
        );

        document
          .getElementById("alreadyLogin")
          .style.display = "block";

        return;
      }


      /* ===============================================
         CHECK DUPLICATE MOBILE
      =============================================== */

      const mobileQuery =
        query(
          usersRef,
          where("mobile", "==", mobile)
        );


      const mobileSnapshot =
        await getDocs(mobileQuery);


      if (!mobileSnapshot.empty) {

        showMessage(
          "registerMessage",
          "Already exists. Please login.",
          "error"
        );

        document
          .getElementById("alreadyLogin")
          .style.display = "block";

        return;
      }


      /* ===============================================
         SAVE TEMP DATA
      =============================================== */

      localStorage.setItem(
        "pendingName",
        name
      );

      localStorage.setItem(
        "pendingMobile",
        mobile
      );

      localStorage.setItem(
        "emailForSignIn",
        email
      );

      localStorage.setItem(
        "loginType",
        "registration"
      );


      /* ===============================================
         SEND GMAIL VERIFICATION LINK
      =============================================== */

      await sendSignInLinkToEmail(
        auth,
        email,
        actionCodeSettings
      );


      showMessage(
        "registerMessage",
        "Verification link sent to your Gmail. Please open the link.",
        "success"
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "registerMessage",
        "Error: " + error.message,
        "error"
      );

    }

  });


  /* =====================================================
     PROCESS EMAIL VERIFICATION LINK
  ===================================================== */

  async function processEmailLink() {

    /*
      If current URL is not a Firebase email
      sign-in link, do nothing.
    */

    if (!isSignInWithEmailLink(
      auth,
      window.location.href
    )) {

      return;

    }


    let email =
      localStorage.getItem(
        "emailForSignIn"
      );


    /*
      If email is missing, ask user.
    */

    if (!email) {

      email =
        window.prompt(
          "Please enter the email address where you received the verification link:"
        );

    }


    if (!email) {

      showMessage(
        "loginMessage",
        "Email is required to complete verification.",
        "error"
      );

      return;
    }


    email =
      email.trim().toLowerCase();


    try {

      /*
        COMPLETE FIREBASE EMAIL LINK LOGIN
      */

      const result =
        await signInWithEmailLink(
          auth,
          email,
          window.location.href
        );


      const verifiedEmail =
        result.user.email
          .trim()
          .toLowerCase();


      /* =================================================
         MOST IMPORTANT PART
         
         COORDINATOR IS CHECKED FIRST.
         
         NO FIRESTORE QUERY.
         
         NO REGISTRATION CHECK.
         
         DIRECT DASHBOARD.
      ================================================= */

      if (
        verifiedEmail ===
        COORDINATOR_EMAIL
      ) {

        /*
          Clean temporary data
        */

        localStorage.removeItem(
          "emailForSignIn"
        );

        localStorage.removeItem(
          "loginType"
        );

        localStorage.removeItem(
          "pendingName"
        );

        localStorage.removeItem(
          "pendingMobile"
        );


        /*
          DIRECT COORDINATOR DASHBOARD
        */

        window.location.replace(
          "coordinator.html"
        );

        return;
      }


      /* =================================================
         REGISTRATION VERIFICATION
      ================================================= */

      const pendingName =
        localStorage.getItem(
          "pendingName"
        );

      const pendingMobile =
        localStorage.getItem(
          "pendingMobile"
        );


      const loginType =
        localStorage.getItem(
          "loginType"
        );


      /*
        If this was a new registration,
        create pending request.
      */

      if (
        loginType === "registration" &&
        pendingName &&
        pendingMobile
      ) {

        await addDoc(
          collection(
            db,
            "registrationRequests"
          ),
          {

            uid:
              result.user.uid,

            name:
              pendingName,

            email:
              verifiedEmail,

            mobile:
              pendingMobile,

            verifiedBy:
              "gmail",

            status:
              "pending",

            createdAt:
              serverTimestamp()

          }
        );


        localStorage.removeItem(
          "pendingName"
        );

        localStorage.removeItem(
          "pendingMobile"
        );

        localStorage.removeItem(
          "emailForSignIn"
        );

        localStorage.removeItem(
          "loginType"
        );


        showMessage(
          "registerMessage",
          "Gmail verified successfully. Your registration is now pending Coordinator approval.",
          "success"
        );


        return;
      }


      /*
        Normal approved user login.
        Board page can be connected here later.
      */

      if (loginType === "user") {

        localStorage.removeItem(
          "emailForSignIn"
        );

        localStorage.removeItem(
          "loginType"
        );


        showMessage(
          "loginMessage",
          "Gmail verified successfully.",
          "success"
        );


        return;
      }


    } catch (error) {

      console.error(error);

      showMessage(
        "loginMessage",
        "Verification failed: " +
        error.message,
        "error"
      );

    }

  }


  /* =====================================================
     START EMAIL LINK PROCESSING
  ===================================================== */

  processEmailLink();


  /* =====================================================
     AUTH STATE
     
     Do NOT automatically redirect coordinator merely
     because Firebase remembers a previous login.
     
     Dashboard redirect happens after the email link
     is actually processed above.
  ===================================================== */

  onAuthStateChanged(
    auth,
    (user) => {

      if (user) {

        console.log(
          "Firebase user:",
          user.email
        );

      }

    }
  );

</script>

</body>
</html>
