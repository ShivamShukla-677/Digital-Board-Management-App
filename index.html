<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Digital Board Management</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      width: 350px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Digital Board Access</h1>

    <form id="registrationForm">

      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Enter your Gmail"
        required
      >

      <input
        type="tel"
        id="mobile"
        placeholder="Enter mobile number"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Create password"
        required
      >

      <button type="submit">
        Register
      </button>

    </form>

    <div id="message"></div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword
    }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc
    }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


    // Firebase Configuration

    const firebaseConfig = {
      apiKey: "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",
      authDomain: "digital-board-acces-management.firebaseapp.com",
      projectId: "digital-board-acces-management",
      storageBucket: "digital-board-acces-management.firebasestorage.app",
      messagingSenderId: "902348932290",
      appId: "1:902348932290:web:db47f1b012bf882886675b"
    };


    // Firebase start

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // Registration

    document
      .getElementById("registrationForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
          document.getElementById("name").value;

        const email =
          document.getElementById("email").value;

        const mobile =
          document.getElementById("mobile").value;

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");


        message.innerText = "Registering...";


        try {

          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          // Save user information in Firestore

          await setDoc(
            doc(db, "users", user.uid),
            {
              name: name,
              email: email,
              mobile: mobile,
              status: "pending",
              createdAt: new Date()
            }
          );


          message.style.color = "green";

          message.innerText =
            "Registration successful! Waiting for coordinator approval.";


          document
            .getElementById("registrationForm")
            .reset();


        } catch (error) {

          console.error(error);

          message.style.color = "red";

          message.innerText =
            error.message;

        }

      });

  </script>

</body>
</html>
