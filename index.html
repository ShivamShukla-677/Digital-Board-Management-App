<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Board Management</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
    }

    .container {
      max-width: 480px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin-top: 10px;
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
    }

    .tab {
      width: 50%;
      padding: 12px;
      border: 0;
      cursor: pointer;
      font-size: 16px;
      background: #ddd;
    }

    .tab.active {
      background: #007bff;
      color: white;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .main-btn {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    .stop-btn {
      background: #dc3545;
    }

    .board-section {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .board-section.active {
      display: block;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
    }

    .success {
      display: block;
      background: #d4edda;
      color: #155724;
    }

    .error {
      display: block;
      background: #f8d7da;
      color: #721c24;
    }

    .info {
      display: block;
      background: #d1ecf1;
      color: #0c5460;
    }

    .link {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #007bff;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Digital Board Management</h1>

  <div class="tabs">
    <button id="loginTab" class="tab active">Login</button>
    <button id="registerTab" class="tab">Register</button>
  </div>


  <!-- LOGIN -->
  <div id="loginForm" class="form active">

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter Gmail"
    >

    <button id="loginBtn" class="main-btn">
      Send Login Link
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- REGISTER -->
  <div id="registerForm" class="form">

    <input
      type="text"
      id="name"
      placeholder="Enter Name"
    >

    <input
      type="email"
      id="registerEmail"
      placeholder="Enter Gmail"
    >

    <input
      type="tel"
      id="mobile"
      placeholder="10 Digit Mobile Number"
      maxlength="10"
    >

    <button id="registerBtn" class="main-btn">
      Register
    </button>

    <div id="registerMessage" class="message"></div>

    <span id="goLogin" class="link">
      Already registered? Login
    </span>

  </div>


  <!-- BOARD ACCESS -->
  <div id="boardSection" class="board-section">

    <h2>Board Access</h2>

    <input
      type="text"
      id="boardCode"
      placeholder="Enter 6 Character Board Code"
      maxlength="6"
      autocomplete="off"
    >

    <button id="checkBoardBtn" class="main-btn">
      Check Board Code
    </button>

    <div id="boardMessage" class="message"></div>

    <button
      id="shareBtn"
      class="main-btn"
      style="display:none;"
    >
      Screen Share
    </button>

    <button
      id="stopShareBtn"
      class="main-btn stop-btn"
      style="display:none;"
    >
      Stop Sharing
    </button>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    sendSignInLinkToEmail,
    isSignInWithEmailLink,
    signInWithEmailLink
  }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    serverTimestamp
  }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* ==============================
     FIREBASE
  ============================== */

  const firebaseConfig = {
    apiKey: "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",
    authDomain: "digital-board-acces-management.firebaseapp.com",
    projectId: "digital-board-acces-management",
    storageBucket: "digital-board-acces-management.firebasestorage.app",
    messagingSenderId: "902348932290",
    appId: "1:902348932290:web:db47f1b012bf882886675b"
  };

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* ==============================
     IMPORTANT EMAILS / URL
  ============================== */

  const COORDINATOR_EMAIL =
    "anujshivamshukla99359@gmail.com";

  const COORDINATOR_URL =
    "https://shivamshukla-677.github.io/Digital-Board-Management-App/coordinator.html";

  const HOME_URL =
    "https://shivamshukla-677.github.io/Digital-Board-Management-App/";

  const actionCodeSettings = {
    url: HOME_URL,
    handleCodeInApp: true
  };


  /* ==============================
     SCREEN SHARE STREAM
  ============================== */

  let screenStream = null;


  /* ==============================
     MESSAGE
  ============================== */

  function message(id, text, type) {

    const box = document.getElementById(id);

    box.textContent = text;

    box.className = "message " + type;

  }


  /* ==============================
     TABS
  ============================== */

  document.getElementById("loginTab").onclick = function () {

    document.getElementById("loginTab")
      .classList.add("active");

    document.getElementById("registerTab")
      .classList.remove("active");

    document.getElementById("loginForm")
      .classList.add("active");

    document.getElementById("registerForm")
      .classList.remove("active");

  };


  document.getElementById("registerTab").onclick = function () {

    document.getElementById("registerTab")
      .classList.add("active");

    document.getElementById("loginTab")
      .classList.remove("active");

    document.getElementById("registerForm")
      .classList.add("active");

    document.getElementById("loginForm")
      .classList.remove("active");

  };


  document.getElementById("goLogin").onclick = function () {

    document.getElementById("loginTab").click();

  };


  /* ==============================
     REGISTER
  ============================== */

  document.getElementById("registerBtn").onclick =
    async function () {

      const name =
        document.getElementById("name")
          .value.trim();

      const email =
        document.getElementById("registerEmail")
          .value.trim().toLowerCase();

      const mobile =
        document.getElementById("mobile")
          .value.trim();


      if (!name) {

        message(
          "registerMessage",
          "Please enter your name.",
          "error"
        );

        return;
      }


      if (!email.endsWith("@gmail.com")) {

        message(
          "registerMessage",
          "Please use a Gmail address.",
          "error"
        );

        return;
      }


      if (!/^[0-9]{10}$/.test(mobile)) {

        message(
          "registerMessage",
          "Mobile number must be exactly 10 digits.",
          "error"
        );

        return;
      }


      try {

        message(
          "registerMessage",
          "Checking details...",
          "info"
        );


        /* CHECK EMAIL */

        const emailQuery = query(
          collection(db, "registrationRequests"),
          where("email", "==", email)
        );

        const emailResult =
          await getDocs(emailQuery);


        if (!emailResult.empty) {

          message(
            "registerMessage",
            "Already exists. Please login.",
            "error"
          );

          return;
        }


        /* CHECK MOBILE */

        const mobileQuery = query(
          collection(db, "registrationRequests"),
          where("mobile", "==", mobile)
        );

        const mobileResult =
          await getDocs(mobileQuery);


        if (!mobileResult.empty) {

          message(
            "registerMessage",
            "Already exists. Please login.",
            "error"
          );

          return;
        }


        /* SAVE TEMP DATA */

        localStorage.setItem(
          "pendingName",
          name
        );

        localStorage.setItem(
          "pendingMobile",
          mobile
        );

        localStorage.setItem(
          "emailForSignIn",
          email
        );

        localStorage.setItem(
          "loginType",
          "registration"
        );


        /* SEND EMAIL */

        await sendSignInLinkToEmail(
          auth,
          email,
          actionCodeSettings
        );


        message(
          "registerMessage",
          "Verification link sent. Open the latest email from Firebase.",
          "success"
        );

      }

      catch (error) {

        console.error(error);

        message(
          "registerMessage",
          error.message,
          "error"
        );

      }

    };


  /* ==============================
     LOGIN
  ============================== */

  document.getElementById("loginBtn").onclick =
    async function () {

      const email =
        document.getElementById("loginEmail")
          .value.trim().toLowerCase();


      if (!email) {

        message(
          "loginMessage",
          "Please enter your Gmail.",
          "error"
        );

        return;
      }


      if (!email.endsWith("@gmail.com")) {

        message(
          "loginMessage",
          "Please use a valid Gmail address.",
          "error"
        );

        return;
      }


      try {

        /* COORDINATOR */

        if (email === COORDINATOR_EMAIL) {

          localStorage.setItem(
            "emailForSignIn",
            COORDINATOR_EMAIL
          );

          localStorage.setItem(
            "loginType",
            "coordinator"
          );


          await sendSignInLinkToEmail(
            auth,
            COORDINATOR_EMAIL,
            actionCodeSettings
          );


          message(
            "loginMessage",
            "Coordinator verification link sent to Gmail.",
            "success"
          );

          return;
        }


        /* NORMAL USER */

        const userQuery = query(
          collection(db, "registrationRequests"),
          where("email", "==", email)
        );

        const result =
          await getDocs(userQuery);


        if (result.empty) {

          message(
            "loginMessage",
            "You are not registered. Please register first.",
            "error"
          );

          return;
        }


        let userData;

        result.forEach(function (doc) {

          userData = doc.data();

        });


        if (userData.status === "pending") {

          message(
            "loginMessage",
            "Your registration is waiting for Coordinator approval.",
            "info"
          );

          return;
        }


        if (userData.status === "rejected") {

          message(
            "loginMessage",
            "Your registration has been rejected.",
            "error"
          );

          return;
        }


        if (userData.status !== "approved") {

          message(
            "loginMessage",
            "Your account is not approved yet.",
            "error"
          );

          return;
        }


        localStorage.setItem(
          "emailForSignIn",
          email
        );

        localStorage.setItem(
          "loginType",
          "user"
        );


        await sendSignInLinkToEmail(
          auth,
          email,
          actionCodeSettings
        );


        message(
          "loginMessage",
          "Login verification link sent to Gmail.",
          "success"
        );

      }

      catch (error) {

        console.error(error);

        message(
          "loginMessage",
          error.message,
          "error"
        );

      }

    };


  /* ==============================
     PROCESS EMAIL LINK
  ============================== */

  async function processEmailLink() {

    if (
      !isSignInWithEmailLink(
        auth,
        window.location.href
      )
    ) {

      return;

    }


    try {

      let email =
        localStorage.getItem(
          "emailForSignIn"
        );


      if (!email) {

        email = prompt(
          "Enter the Gmail address used for verification:"
        );

      }


      if (!email) {

        alert("Gmail is required.");

        return;

      }


      email =
        email.trim().toLowerCase();


      /* FIREBASE SIGN IN */

      const result =
        await signInWithEmailLink(
          auth,
          email,
          window.location.href
        );


      const verifiedEmail =
        result.user.email
          .trim()
          .toLowerCase();


      console.log(
        "VERIFIED EMAIL:",
        verifiedEmail
      );


      /* ==============================
         COORDINATOR
      ============================== */

      if (
        verifiedEmail ===
        COORDINATOR_EMAIL
      ) {

        localStorage.removeItem(
          "emailForSignIn"
        );

        localStorage.removeItem(
          "loginType"
        );

        localStorage.removeItem(
          "pendingName"
        );

        localStorage.removeItem(
          "pendingMobile"
        );


        window.location.replace(
          COORDINATOR_URL
        );

        return;

      }


      /* ==============================
         REGISTRATION
      ============================== */

      const loginType =
        localStorage.getItem(
          "loginType"
        );


      if (
        loginType === "registration"
      ) {

        const name =
          localStorage.getItem(
            "pendingName"
          );

        const mobile =
          localStorage.getItem(
            "pendingMobile"
          );


        if (!name || !mobile) {

          alert(
            "Registration information missing. Please register again."
          );

          return;

        }


        const checkQuery = query(
          collection(db, "registrationRequests"),
          where("email", "==", verifiedEmail)
        );

        const checkResult =
          await getDocs(checkQuery);


        if (checkResult.empty) {

          await addDoc(
            collection(db, "registrationRequests"),
            {
              uid: result.user.uid,
              name: name,
              email: verifiedEmail,
              mobile: mobile,
              verifiedBy: "gmail",
              status: "pending",
              createdAt: serverTimestamp()
            }
          );

        }


        localStorage.removeItem(
          "emailForSignIn"
        );

        localStorage.removeItem(
          "loginType"
        );

        localStorage.removeItem(
          "pendingName"
        );

        localStorage.removeItem(
          "pendingMobile"
        );


        alert(
          "Gmail verified successfully. Your registration is now pending Coordinator approval."
        );

        return;

      }


      /* ==============================
         NORMAL USER LOGIN
      ============================== */

      const userQuery = query(
        collection(db, "registrationRequests"),
        where("email", "==", verifiedEmail)
      );

      const userResult =
        await getDocs(userQuery);


      if (userResult.empty) {

        alert(
          "Registration not found."
        );

        return;

      }


      let userData = null;

      userResult.forEach(function(doc) {

        userData = doc.data();

      });


      if (userData.status !== "approved") {

        alert(
          "Your account is not approved."
        );

        return;

      }


      /*
       APPROVED USER
       SHOW BOARD ACCESS
      */

      document.getElementById(
        "loginForm"
      ).style.display = "none";

      document.getElementById(
        "registerForm"
      ).style.display = "none";

      document.querySelector(
        ".tabs"
      ).style.display = "none";


      document.getElementById(
        "boardSection"
      ).classList.add("active");


      message(
        "boardMessage",
        "Login successful. Enter the 6-character Board Code.",
        "info"
      );


      localStorage.setItem(
        "approvedUserEmail",
        verifiedEmail
      );


    }

    catch (error) {

      console.error(
        "VERIFICATION ERROR:",
        error
      );


      alert(
        "Verification failed: " +
        error.message
      );

    }

  }


  /* ==============================
     BOARD CODE CHECK
  ============================== */

  document.getElementById(
    "checkBoardBtn"
  ).onclick = async function () {

    const code =
      document.getElementById(
        "boardCode"
      ).value.trim().toUpperCase();


    if (!/^[A-Z0-9]{6}$/.test(code)) {

      message(
        "boardMessage",
        "Board Code must be exactly 6 characters.",
        "error"
      );

      return;

    }


    try {

      message(
        "boardMessage",
        "Checking Board Code...",
        "info"
      );


      const boardQuery = query(
        collection(db, "boards"),
        where("boardCode", "==", code)
      );


      const boardResult =
        await getDocs(boardQuery);


      if (boardResult.empty) {

        message(
          "boardMessage",
          "Invalid Board Code. Please enter the code shown on the board.",
          "error"
        );

        document.getElementById(
          "shareBtn"
        ).style.display = "none";

        return;

      }


      let validBoard = false;


      boardResult.forEach(function(doc) {

        const data = doc.data();

        if (
          data.boardCode === code &&
          data.status === "available"
        ) {

          validBoard = true;

        }

      });


      if (!validBoard) {

        message(
          "boardMessage",
          "This Board Code is not available.",
          "error"
        );

        document.getElementById(
          "shareBtn"
        ).style.display = "none";

        return;

      }


      message(
        "boardMessage",
        "Board Code matched successfully.",
        "success"
      );


      document.getElementById(
        "shareBtn"
      ).style.display = "block";


    }

    catch (error) {

      console.error(error);

      message(
        "boardMessage",
        "Error checking Board Code: " + error.message,
        "error"
      );

    }

  };


  /* ==============================
     SCREEN SHARE
  ============================== */

  document.getElementById(
    "shareBtn"
  ).onclick = async function () {

    try {

      screenStream =
        await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });


      message(
        "boardMessage",
        "Screen sharing started.",
        "success"
      );


      document.getElementById(
        "shareBtn"
      ).style.display = "none";


      document.getElementById(
        "stopShareBtn"
      ).style.display = "block";


      const videoTrack =
        screenStream.getVideoTracks()[0];


      videoTrack.onended = function () {

        stopScreenShare();

      };

    }

    catch (error) {

      console.error(error);

      message(
        "boardMessage",
        "Screen sharing was cancelled or could not start.",
        "error"
      );

    }

  };


  /* ==============================
     STOP SCREEN SHARE
  ============================== */

  function stopScreenShare() {

    if (screenStream) {

      screenStream
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });

      screenStream = null;

    }


    document.getElementById(
      "stopShareBtn"
    ).style.display = "none";


    document.getElementById(
      "shareBtn"
    ).style.display = "block";


    message(
      "boardMessage",
      "Screen sharing stopped.",
      "info"
    );

  }


  document.getElementById(
    "stopShareBtn"
  ).onclick = function () {

    stopScreenShare();

  };


  /* ==============================
     START
  ============================== */

  processEmailLink();

</script>

</body>
</html>
