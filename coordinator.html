<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Coordinator Dashboard</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
    }

    .logout {
      background: white;
      color: #2563eb;
      border: none;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
    }

    .container {
      padding: 25px;
      max-width: 1200px;
      margin: auto;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .table-container {
      background: white;
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 13px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f1f5f9;
    }

    .status {
      font-weight: bold;
    }

    .pending {
      color: #d97706;
    }

    .approved {
      color: #16a34a;
    }

    .rejected {
      color: #dc2626;
    }

    button.action {
      border: none;
      padding: 8px 11px;
      border-radius: 6px;
      cursor: pointer;
      margin: 2px;
      color: white;
    }

    .approve {
      background: #16a34a;
    }

    .reject {
      background: #dc2626;
    }

    .delete {
      background: #64748b;
    }

    .empty {
      padding: 25px;
      text-align: center;
    }

  </style>

</head>


<body>


<header>

  <h2>Coordinator Dashboard</h2>

  <button class="logout"
          onclick="logout()">
    Logout
  </button>

</header>


<div class="container">


  <div class="welcome">

    <h3>Welcome Coordinator</h3>

    <p>
      Manage Digital Board registration requests
      from this dashboard.
    </p>

  </div>


  <div class="table-container">

    <table>

      <thead>

        <tr>

          <th>Name</th>

          <th>Gmail</th>

          <th>Mobile</th>

          <th>Verification</th>

          <th>Status</th>

          <th>Action</th>

        </tr>

      </thead>


      <tbody id="requestsTable">

      </tbody>

    </table>

  </div>

</div>



<script type="module">


import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  updateDoc,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",

  authDomain:
    "digital-board-acces-management.firebaseapp.com",

  projectId:
    "digital-board-acces-management",

  storageBucket:
    "digital-board-acces-management.firebasestorage.app",

  messagingSenderId:
    "902348932290",

  appId:
    "1:902348932290:web:db47f1b012bf882886675b"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);



/* NEW COORDINATOR EMAIL */

const COORDINATOR_EMAIL =
  "anujshivamshukla99359@gamil.com";



/* CHECK COORDINATOR */

onAuthStateChanged(
  auth,
  async (user) => {

    if (!user) {

      window.location.href =
        "index.html";

      return;

    }


    if (
      user.email.toLowerCase() !==
      COORDINATOR_EMAIL
    ) {

      await signOut(auth);

      window.location.href =
        "index.html";

      return;

    }


    loadRequests();

  }
);



/* LOAD REQUESTS */

async function loadRequests() {

  const table =
    document.getElementById(
      "requestsTable"
    );


  table.innerHTML = "";


  try {

    const snapshot =
      await getDocs(
        collection(
          db,
          "registrationRequests"
        )
      );


    if (snapshot.empty) {

      table.innerHTML = `
        <tr>
          <td colspan="6"
              class="empty">
            No registration requests found.
          </td>
        </tr>
      `;

      return;

    }



    snapshot.forEach(
      (item) => {

        const data =
          item.data();


        const row =
          document.createElement("tr");


        const status =
          data.status || "pending";


        row.innerHTML = `

          <td>
            ${data.name || "-"}
          </td>

          <td>
            ${data.email || "-"}
          </td>

          <td>
            ${data.mobile || "-"}
          </td>

          <td>
            ${data.verifiedBy || "-"}
          </td>

          <td class="status ${status}">
            ${status}
          </td>

          <td>

            <button
              class="action approve"
              onclick="approveUser('${item.id}')">
              Approve
            </button>

            <button
              class="action reject"
              onclick="rejectUser('${item.id}')">
              Reject
            </button>

            <button
              class="action delete"
              onclick="deleteUser('${item.id}')">
              Delete
            </button>

          </td>

        `;


        table.appendChild(row);

      }
    );


  } catch (error) {

    console.error(error);

    table.innerHTML = `
      <tr>
        <td colspan="6"
            class="empty">
          Error loading requests:
          ${error.message}
        </td>
      </tr>
    `;

  }

}



/* APPROVE */

window.approveUser =
async function(id) {

  try {

    await updateDoc(
      doc(
        db,
        "registrationRequests",
        id
      ),
      {
        status: "approved"
      }
    );


    alert(
      "User approved successfully."
    );


    loadRequests();


  } catch (error) {

    alert(
      "Error: " +
      error.message
    );

  }

};



/* REJECT */

window.rejectUser =
async function(id) {

  try {

    await updateDoc(
      doc(
        db,
        "registrationRequests",
        id
      ),
      {
        status: "rejected"
      }
    );


    alert(
      "User rejected."
    );


    loadRequests();


  } catch (error) {

    alert(
      "Error: " +
      error.message
    );

  }

};



/* DELETE */

window.deleteUser =
async function(id) {

  if (
    !confirm(
      "Are you sure you want to delete this request?"
    )
  ) {

    return;

  }


  try {

    await deleteDoc(
      doc(
        db,
        "registrationRequests",
        id
      )
    );


    alert(
      "Request deleted."
    );


    loadRequests();


  } catch (error) {

    alert(
      "Error: " +
      error.message
    );

  }

};



/* LOGOUT */

window.logout =
async function() {

  await signOut(auth);

  window.location.href =
    "index.html";

};


</script>

</body>

</html>
