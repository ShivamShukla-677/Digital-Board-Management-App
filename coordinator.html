<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Coordinator Dashboard</title>


  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    button {
      padding: 9px 14px;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      margin: 3px;
    }

    .approve {
      background: #198754;
    }

    .reject {
      background: #dc3545;
    }

    .delete {
      background: #6c757d;
    }

    .logout {
      background: #212529;
      float: right;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #1976d2;
      color: white;
    }

    .pending {
      color: #d97706;
      font-weight: bold;
    }

    .approved {
      color: #198754;
      font-weight: bold;
    }

    .rejected {
      color: #dc3545;
      font-weight: bold;
    }

    #loading {
      text-align: center;
      margin-top: 20px;
    }

  </style>

</head>


<body>

<div class="container">

  <button
    class="logout"
    onclick="logoutCoordinator()"
  >
    Logout
  </button>


  <h1>Coordinator Dashboard</h1>

  <p id="welcome"></p>

  <div id="loading">
    Loading registrations...
  </div>


  <table id="registrationTable">

    <thead>

      <tr>

        <th>Name</th>

        <th>Gmail</th>

        <th>Mobile</th>

        <th>Verification</th>

        <th>Status</th>

        <th>Action</th>

      </tr>

    </thead>


    <tbody id="registrationBody">

    </tbody>

  </table>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  // =========================
  // FIREBASE CONFIG
  // =========================

  const firebaseConfig = {

    apiKey:
      "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",

    authDomain:
      "digital-board-acces-management.firebaseapp.com",

    projectId:
      "digital-board-acces-management",

    storageBucket:
      "digital-board-acces-management.firebasestorage.app",

    messagingSenderId:
      "902348932290",

    appId:
      "1:902348932290:web:db47f1b012bf882886675b"

  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  const COORDINATOR_EMAIL =
    "anujshivamshukla99359@gmail.com";


  // =========================
  // AUTH CHECK
  // =========================

  onAuthStateChanged(
    auth,
    async user => {

      if (!user) {

        window.location.href =
          "index.html";

        return;
      }


      if (
        user.email.toLowerCase() !==
        COORDINATOR_EMAIL
      ) {

        await signOut(auth);

        window.location.href =
          "index.html";

        return;
      }


      document.getElementById(
        "welcome"
      ).textContent =
        "Welcome, Coordinator";


      loadRegistrations();

    }
  );


  // =========================
  // LOAD REGISTRATIONS
  // =========================

  async function loadRegistrations() {

    const body =
      document.getElementById(
        "registrationBody"
      );


    body.innerHTML = "";


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "registrationRequests"
          )
        );


      document.getElementById(
        "loading"
      ).style.display = "none";


      if (snapshot.empty) {

        body.innerHTML = `
          <tr>
            <td colspan="6">
              No registration requests found.
            </td>
          </tr>
        `;

        return;
      }


      snapshot.forEach(
        registrationDoc => {

          const data =
            registrationDoc.data();


          const id =
            registrationDoc.id;


          const row =
            document.createElement("tr");


          let statusClass =
            data.status || "pending";


          row.innerHTML = `

            <td>
              ${escapeHTML(data.name || "")}
            </td>

            <td>
              ${escapeHTML(data.email || "")}
            </td>

            <td>
              ${escapeHTML(data.mobile || "")}
            </td>

            <td>
              ${escapeHTML(
                data.verification ||
                "Temporary Password"
              )}
            </td>

            <td class="${statusClass}">
              ${escapeHTML(
                data.status || "pending"
              )}
            </td>

            <td>

              <button
                class="approve"
                onclick="approveUser('${id}')"
              >
                Approve
              </button>

              <button
                class="reject"
                onclick="rejectUser('${id}')"
              >
                Reject
              </button>

              <button
                class="delete"
                onclick="deleteUser('${id}')"
              >
                Delete
              </button>

            </td>

          `;


          body.appendChild(row);

        }
      );


    } catch (error) {

      console.error(error);

      document.getElementById(
        "loading"
      ).textContent =
        "Error loading registrations: " +
        error.message;

    }

  }


  // =========================
  // APPROVE
  // =========================

  window.approveUser =
    async function(id) {

      try {

        await updateDoc(
          doc(
            db,
            "registrationRequests",
            id
          ),
          {
            status: "approved"
          }
        );


        alert(
          "User approved successfully."
        );


        loadRegistrations();


      } catch (error) {

        alert(
          "Approve failed: " +
          error.message
        );

      }

    };


  // =========================
  // REJECT
  // =========================

  window.rejectUser =
    async function(id) {

      try {

        await updateDoc(
          doc(
            db,
            "registrationRequests",
            id
          ),
          {
            status: "rejected"
          }
        );


        alert(
          "User rejected."
        );


        loadRegistrations();


      } catch (error) {

        alert(
          "Reject failed: " +
          error.message
        );

      }

    };


  // =========================
  // DELETE
  // =========================

  window.deleteUser =
    async function(id) {

      const confirmDelete =
        confirm(
          "Are you sure you want to delete this registration?"
        );


      if (!confirmDelete)
        return;


      try {

        await deleteDoc(
          doc(
            db,
            "registrationRequests",
            id
          )
        );


        alert(
          "Registration deleted."
        );


        loadRegistrations();


      } catch (error) {

        alert(
          "Delete failed: " +
          error.message
        );

      }

    };


  // =========================
  // LOGOUT
  // =========================

  window.logoutCoordinator =
    async function() {

      await signOut(auth);

      window.location.href =
        "index.html";

    };


  // =========================
  // SECURITY
  // =========================

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>

</html>
