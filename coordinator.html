<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coordinator Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    #logoutBtn {
      background: white;
      color: #2563eb;
      border: none;
      padding: 10px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .table-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 13px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f1f5f9;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      display: inline-block;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .approved {
      background: #dcfce7;
      color: #166534;
    }

    .rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .action-btn {
      border: none;
      padding: 8px 11px;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      margin: 2px;
    }

    .approve {
      background: #16a34a;
    }

    .reject {
      background: #dc2626;
    }

    .delete {
      background: #475569;
    }

    .action-btn:hover {
      opacity: 0.85;
    }

    .message {
      display: none;
      padding: 13px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

  <header>

    <h1>Coordinator Dashboard</h1>

    <button id="logoutBtn">
      Logout
    </button>

  </header>


  <div class="container">

    <div class="welcome">

      <h2>Welcome Coordinator</h2>

      <p id="coordinatorEmail"></p>

    </div>


    <div id="message" class="message"></div>


    <div class="table-box">

      <h2>Registration Requests</h2>

      <div id="loading" class="loading">
        Loading registrations...
      </div>

      <table id="registrationTable" style="display:none;">

        <thead>

          <tr>
            <th>Name</th>
            <th>Gmail</th>
            <th>Mobile</th>
            <th>Verification</th>
            <th>Status</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="registrationBody"></tbody>

      </table>


      <div
        id="emptyMessage"
        class="empty"
        style="display:none;"
      >
        No registration requests found.
      </div>

    </div>

  </div>


<script type="module">

  import {
    initializeApp
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  // ==========================================
  // FIREBASE CONFIG
  // ==========================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",

    authDomain:
      "digital-board-acces-management.firebaseapp.com",

    projectId:
      "digital-board-acces-management",

    storageBucket:
      "digital-board-acces-management.firebasestorage.app",

    messagingSenderId:
      "902348932290",

    appId:
      "1:902348932290:web:db47f1b012bf882886675b"

  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  // ==========================================
  // AUTHORIZED COORDINATOR
  // ==========================================

  const COORDINATOR_EMAIL =
    "anujshivamshukla@gmail.com";


  // ==========================================
  // ELEMENTS
  // ==========================================

  const coordinatorEmail =
    document.getElementById(
      "coordinatorEmail"
    );


  const logoutBtn =
    document.getElementById(
      "logoutBtn"
    );


  const registrationBody =
    document.getElementById(
      "registrationBody"
    );


  const registrationTable =
    document.getElementById(
      "registrationTable"
    );


  const loading =
    document.getElementById(
      "loading"
    );


  const emptyMessage =
    document.getElementById(
      "emptyMessage"
    );


  const message =
    document.getElementById(
      "message"
    );


  // ==========================================
  // SHOW MESSAGE
  // ==========================================

  function showMessage(
    text,
    type
  ) {

    message.textContent =
      text;

    message.className =
      "message " + type;

  }


  // ==========================================
  // AUTH CHECK
  // ==========================================

  onAuthStateChanged(
    auth,
    async (user) => {

      if (!user) {

        window.location.href =
          "index.html";

        return;

      }


      const email =
        (
          user.email || ""
        ).toLowerCase();


      if (
        email !==
        COORDINATOR_EMAIL
      ) {

        await signOut(auth);

        window.location.href =
          "index.html";

        return;

      }


      coordinatorEmail.textContent =
        email;


      loadRegistrations();

    }
  );


  // ==========================================
  // LOAD REGISTRATIONS
  // ==========================================

  async function loadRegistrations() {

    loading.style.display =
      "block";

    registrationTable.style.display =
      "none";

    emptyMessage.style.display =
      "none";


    registrationBody.innerHTML =
      "";


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "registrationRequests"
          )
        );


      loading.style.display =
        "none";


      if (
        snapshot.empty
      ) {

        emptyMessage.style.display =
          "block";

        return;

      }


      registrationTable.style.display =
        "table";


      snapshot.forEach(
        (registrationDoc) => {

          const data =
            registrationDoc.data();


          const row =
            document.createElement(
              "tr"
            );


          const status =
            data.status ||
            "pending";


          row.innerHTML = `

            <td>
              ${escapeHtml(data.name || "")}
            </td>

            <td>
              ${escapeHtml(data.email || "")}
            </td>

            <td>
              ${escapeHtml(data.mobile || "")}
            </td>

            <td>
              ${escapeHtml(data.verifiedBy || "")}
            </td>

            <td>
              <span class="status ${status}">
                ${status}
              </span>
            </td>

            <td>

              <button
                class="action-btn approve"
                data-id="${registrationDoc.id}"
                data-action="approve"
              >
                Approve
              </button>

              <button
                class="action-btn reject"
                data-id="${registrationDoc.id}"
                data-action="reject"
              >
                Reject
              </button>

              <button
                class="action-btn delete"
                data-id="${registrationDoc.id}"
                data-action="delete"
              >
                Delete
              </button>

            </td>

          `;


          registrationBody.appendChild(
            row
          );

        }
      );


      // BUTTON EVENTS

      document
        .querySelectorAll(".action-btn")
        .forEach(
          (button) => {

            button.addEventListener(
              "click",
              () => {

                const id =
                  button.dataset.id;

                const action =
                  button.dataset.action;


                handleAction(
                  id,
                  action
                );

              }
            );

          }
        );


    } catch (error) {

      console.error(error);

      loading.style.display =
        "none";

      showMessage(
        "Unable to load registrations: " +
        error.message,
        "error"
      );

    }

  }


  // ==========================================
  // APPROVE / REJECT / DELETE
  // ==========================================

  async function handleAction(
    id,
    action
  ) {

    try {

      const registrationRef =
        doc(
          db,
          "registrationRequests",
          id
        );


      // APPROVE

      if (
        action ===
        "approve"
      ) {

        await updateDoc(
          registrationRef,
          {
            status:
              "approved"
          }
        );


        showMessage(
          "Registration approved successfully.",
          "success"
        );

      }


      // REJECT

      if (
        action ===
        "reject"
      ) {

        await updateDoc(
          registrationRef,
          {
            status:
              "rejected"
          }
        );


        showMessage(
          "Registration rejected.",
          "success"
        );

      }


      // DELETE

      if (
        action ===
        "delete"
      ) {

        const confirmDelete =
          confirm(
            "Are you sure you want to delete this registration?"
          );


        if (!confirmDelete) {

          return;

        }


        await deleteDoc(
          registrationRef
        );


        showMessage(
          "Registration deleted successfully.",
          "success"
        );

      }


      // REFRESH

      await loadRegistrations();


    } catch (error) {

      console.error(error);

      showMessage(
        "Action failed: " +
        error.message,
        "error"
      );

    }

  }


  // ==========================================
  // HTML ESCAPE
  // ==========================================

  function escapeHtml(
    value
  ) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  // ==========================================
  // LOGOUT
  // ==========================================

  logoutBtn.addEventListener(
    "click",
    async () => {

      await signOut(auth);

      window.location.href =
        "index.html";

    }
  );

</script>

</body>
</html>
