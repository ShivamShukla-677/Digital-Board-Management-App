<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Coordinator Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
    }

    header {
      background: #007bff;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      margin: 0;
    }

    .logout {
      padding: 10px 18px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      background: white;
      color: #007bff;
      font-weight: bold;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f1f1f1;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 2px;
    }

    .approve {
      background: #28a745;
      color: white;
    }

    .reject {
      background: #dc3545;
      color: white;
    }

    .delete {
      background: #343a40;
      color: white;
    }

    .status {
      font-weight: bold;
    }

    #loading {
      text-align: center;
      padding: 30px;
    }

  </style>

</head>


<body>

<header>

  <h2>Coordinator Dashboard</h2>

  <button
    id="logoutBtn"
    class="logout"
  >
    Logout
  </button>

</header>


<div class="container">

  <div class="card">

    <h2>Registration Requests</h2>

    <div id="loading">
      Checking Coordinator access...
    </div>

    <table id="requestTable" style="display:none;">

      <thead>

        <tr>

          <th>Name</th>

          <th>Gmail</th>

          <th>Mobile</th>

          <th>Verification</th>

          <th>Status</th>

          <th>Action</th>

        </tr>

      </thead>

      <tbody id="requestBody"></tbody>

    </table>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    signOut
  }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
  }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* ==============================
     FIREBASE
  ============================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",

    authDomain:
      "digital-board-acces-management.firebaseapp.com",

    projectId:
      "digital-board-acces-management",

    storageBucket:
      "digital-board-acces-management.firebasestorage.app",

    messagingSenderId:
      "902348932290",

    appId:
      "1:902348932290:web:db47f1b012bf882886675b"

  };


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  /* ==============================
     COORDINATOR EMAIL
  ============================== */

  const COORDINATOR_EMAIL =
    "anujshivamshukla99359@gmail.com";


  /* ==============================
     CHECK LOGIN
  ============================== */

  onAuthStateChanged(
    auth,
    async function(user) {

      if (!user) {

        window.location.replace(
          "index.html"
        );

        return;

      }


      const loggedInEmail =
        user.email
          .trim()
          .toLowerCase();


      console.log(
        "Dashboard user:",
        loggedInEmail
      );


      if (
        loggedInEmail !==
        COORDINATOR_EMAIL
      ) {

        await signOut(auth);

        alert(
          "You are not authorized to access Coordinator Dashboard."
        );

        window.location.replace(
          "index.html"
        );

        return;

      }


      /* AUTHORIZED */

      document.getElementById(
        "loading"
      ).style.display = "none";


      document.getElementById(
        "requestTable"
      ).style.display = "table";


      loadRequests();

    }
  );


  /* ==============================
     LOAD REQUESTS
  ============================== */

  async function loadRequests() {

    const body =
      document.getElementById(
        "requestBody"
      );


    body.innerHTML = "";


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "registrationRequests"
          )
        );


      snapshot.forEach(
        function(item) {

          const data =
            item.data();


          const row =
            document.createElement("tr");


          row.innerHTML = `

            <td>
              ${data.name || ""}
            </td>

            <td>
              ${data.email || ""}
            </td>

            <td>
              ${data.mobile || ""}
            </td>

            <td>
              ${data.verifiedBy || ""}
            </td>

            <td class="status">
              ${data.status || ""}
            </td>

            <td>

              <button
                class="approve"
                data-id="${item.id}"
                data-action="approve"
              >
                Approve
              </button>

              <button
                class="reject"
                data-id="${item.id}"
                data-action="reject"
              >
                Reject
              </button>

              <button
                class="delete"
                data-id="${item.id}"
                data-action="delete"
              >
                Delete
              </button>

            </td>

          `;


          body.appendChild(row);

        }
      );


      /* BUTTON EVENTS */

      document
        .querySelectorAll("[data-action]")
        .forEach(
          function(button) {

            button.onclick =
              function() {

                handleAction(
                  button.dataset.id,
                  button.dataset.action
                );

              };

          }
        );

    }

    catch (error) {

      console.error(error);

      body.innerHTML = `
        <tr>
          <td colspan="6">
            Error loading requests:
            ${error.message}
          </td>
        </tr>
      `;

    }

  }


  /* ==============================
     APPROVE / REJECT / DELETE
  ============================== */

  async function handleAction(
    id,
    action
  ) {

    try {

      const requestRef =
        doc(
          db,
          "registrationRequests",
          id
        );


      if (action === "approve") {

        await updateDoc(
          requestRef,
          {
            status: "approved"
          }
        );

      }


      if (action === "reject") {

        await updateDoc(
          requestRef,
          {
            status: "rejected"
          }
        );

      }


      if (action === "delete") {

        const yes =
          confirm(
            "Delete this registration?"
          );


        if (!yes) {

          return;

        }


        await deleteDoc(
          requestRef
        );

      }


      await loadRequests();

    }

    catch (error) {

      console.error(error);

      alert(
        "Action failed: " +
        error.message
      );

    }

  }


  /* ==============================
     LOGOUT
  ============================== */

  document.getElementById(
    "logoutBtn"
  ).onclick = async function() {

    await signOut(auth);

    window.location.replace(
      "index.html"
    );

  };

</script>

</body>

</html>
