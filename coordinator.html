<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinator Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f8;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #666;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      text-align: center;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .dashboard {
      display: none;
    }

    .logout {
      background: #dc2626;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- LOGIN -->
  <div id="loginBox">

    <h1>Coordinator Login</h1>

    <p>Authorized Coordinator Gmail only</p>

    <input
      type="email"
      id="coordinatorEmail"
      placeholder="Coordinator Gmail"
    >

    <button id="loginBtn">
      Send Verification Link
    </button>

    <div id="message" class="message"></div>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard">

    <h1>Coordinator Dashboard</h1>

    <p id="welcome"></p>

    <hr>

    <p>Dashboard is ready.</p>

    <button class="logout" id="logoutBtn">
      Logout
    </button>

  </div>

</div>


<script type="module">

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getAuth,
    sendSignInLinkToEmail,
    isSignInWithEmailLink,
    signInWithEmailLink,
    onAuthStateChanged,
    signOut
  }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  // =========================
  // FIREBASE CONFIG
  // =========================

  const firebaseConfig = {
    apiKey: "AIzaSyCDVZ3SSw8IqMNhrv_b4Pv2OOtP-lFxqZQ",
    authDomain: "digital-board-acces-management.firebaseapp.com",
    projectId: "digital-board-acces-management",
    storageBucket: "digital-board-acces-management.firebasestorage.app",
    messagingSenderId: "902348932290",
    appId: "1:902348932290:web:db47f1b012bf882886675b"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);


  // =========================
  // AUTHORIZED COORDINATOR
  // =========================

  const COORDINATOR_EMAIL =
    "anujshivamshukla@gmail.com";


  // =========================
  // ELEMENTS
  // =========================

  const loginBox =
    document.getElementById("loginBox");

  const dashboard =
    document.getElementById("dashboard");

  const emailInput =
    document.getElementById("coordinatorEmail");

  const loginBtn =
    document.getElementById("loginBtn");

  const message =
    document.getElementById("message");

  const welcome =
    document.getElementById("welcome");

  const logoutBtn =
    document.getElementById("logoutBtn");


  // =========================
  // MESSAGE
  // =========================

  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";

  }


  // =========================
  // SEND LOGIN LINK
  // =========================

  loginBtn.addEventListener("click", async () => {

    const email =
      emailInput.value.trim().toLowerCase();


    if (email !== COORDINATOR_EMAIL) {

      showMessage(
        "This Gmail is not authorized as Coordinator.",
        "error"
      );

      return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
      "Sending...";


    try {

      const actionCodeSettings = {

        url:
          window.location.origin +
          window.location.pathname,

        handleCodeInApp: true

      };


      await sendSignInLinkToEmail(
        auth,
        email,
        actionCodeSettings
      );


      localStorage.setItem(
        "coordinatorEmail",
        email
      );


      showMessage(
        "Verification link Gmail par bhej diya gaya hai.",
        "success"
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "Unable to send verification link: " +
        error.message,
        "error"
      );

    }


    loginBtn.disabled = false;

    loginBtn.textContent =
      "Send Verification Link";

  });


  // =========================
  // VERIFY EMAIL LINK
  // =========================

  async function verifyCoordinator() {

    if (
      !isSignInWithEmailLink(
        auth,
        window.location.href
      )
    ) {

      return;

    }


    const email =
      localStorage.getItem(
        "coordinatorEmail"
      );


    if (!email) {

      showMessage(
        "Coordinator email not found.",
        "error"
      );

      return;

    }


    if (
      email.toLowerCase() !==
      COORDINATOR_EMAIL
    ) {

      showMessage(
        "Unauthorized Coordinator.",
        "error"
      );

      return;

    }


    try {

      const result =
        await signInWithEmailLink(
          auth,
          email,
          window.location.href
        );


      if (
        result.user.email.toLowerCase() !==
        COORDINATOR_EMAIL
      ) {

        await signOut(auth);

        showMessage(
          "Unauthorized account.",
          "error"
        );

        return;

      }


      localStorage.removeItem(
        "coordinatorEmail"
      );


      showDashboard(
        result.user.email
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "Verification failed: " +
        error.message,
        "error"
      );

    }

  }


  // =========================
  // SHOW DASHBOARD
  // =========================

  function showDashboard(email) {

    loginBox.style.display =
      "none";

    dashboard.style.display =
      "block";

    welcome.textContent =
      "Welcome, Coordinator (" +
      email +
      ")";

  }


  // =========================
  // CHECK LOGIN
  // =========================

  onAuthStateChanged(
    auth,
    (user) => {

      if (!user) return;


      if (
        user.email &&
        user.email.toLowerCase() ===
        COORDINATOR_EMAIL
      ) {

        showDashboard(
          user.email
        );

      } else {

        signOut(auth);

      }

    }
  );


  // =========================
  // LOGOUT
  // =========================

  logoutBtn.addEventListener(
    "click",
    async () => {

      await signOut(auth);

      dashboard.style.display =
        "none";

      loginBox.style.display =
        "block";

      emailInput.value = "";

    }
  );


  verifyCoordinator();

</script>

</body>
</html>
